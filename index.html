<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工数打刻">
<meta name="theme-color" content="#12161B">
<title>工数タイムレコーダー</title>
<!--
  ver.1.41.1 (2026-09-13): 「PJを選ぶ」のフェーズタグを、バッジ（開／生／定）とPJ名と同じ高さ（30px・13px太字）に大きくした。位置は右詰めのまま。あわせて生産のフェーズを「1. 継続的改善活動」の1件だけにし、「改善の実施」を削除した（過去の記録に残る名前はそのまま）。
-->
<style>
  :root{
    --bg:#12161B;
    --panel:#1B222A;
    --panel-2:#232C36;
    --line:#2E3944;
    --txt:#E6EDF3;
    --mute:#7D8894;
    --amber:#FFB020;
    --rec:#E5484D;
    --ok:#3FB68B;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--txt);font-family:var(--sans);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 88px) env(safe-area-inset-left);
    min-height:100vh;font-size:15px;line-height:1.5;
  }
  .wrap{max-width:520px;margin:0 auto;padding:12px 14px 24px;}

  /* ── 打刻機ヘッド ── */
  .head{
    background:linear-gradient(180deg,#232C36,#1A2129);
    border:1px solid var(--line);border-radius:14px;
    padding:12px 14px 14px;position:relative;overflow:hidden;flex:0 0 auto;
  }
  .head::before{
    content:"";position:absolute;inset:0 0 auto 0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,176,32,.5),transparent);
  }
  .clockrow{display:flex;align-items:baseline;justify-content:space-between;}
  .clock{font-family:var(--mono);font-size:15px;color:var(--mute);letter-spacing:.04em;font-variant-numeric:tabular-nums;}
  .badge{font-size:11px;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;}

  .display{
    margin-top:8px;text-align:center;
  }
  .elapsed{
    font-family:var(--mono);font-weight:600;
    font-size:clamp(44px,15vw,62px);line-height:1.05;
    color:var(--amber);font-variant-numeric:tabular-nums;
    letter-spacing:.02em;
    text-shadow:0 0 22px rgba(255,176,32,.28);
  }
  .elapsed.idle{color:#3D4855;text-shadow:none;font-size:clamp(30px,9vw,40px);}
  .elapsed.over{color:var(--rec);text-shadow:0 0 22px rgba(229,72,77,.35);}
  .runbanner{
    display:flex;align-items:center;gap:8px;
    margin-top:12px;padding:10px 12px;border-radius:10px;
    background:rgba(229,72,77,.14);border:1px solid rgba(229,72,77,.5);
    color:#F0B4B6;font-size:13px;line-height:1.4;
  }
  .runbanner .rb-icon{font-size:15px;flex:0 0 auto;}
  .nowitem{
    margin-top:4px;font-size:14px;color:var(--txt);min-height:22px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .nowitem .pj{color:var(--mute);}
  .recdot{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--rec);margin-right:6px;vertical-align:middle;
    animation:blink 1.4s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
  @media (prefers-reduced-motion:reduce){.recdot{animation:none}}

  /* ── 大ボタン ── */
  .bigbtn{
    display:block;width:100%;margin-top:14px;
    border:none;border-radius:12px;padding:16px;
    font-size:17px;font-weight:700;letter-spacing:.06em;
    font-family:var(--sans);cursor:pointer;
  }
  .bigbtn.stop{background:var(--rec);color:#fff;box-shadow:0 4px 0 #A6262A;}
  .bigbtn.stop:active{transform:translateY(3px);box-shadow:0 1px 0 #A6262A;}

  /* ── セクション ── */
  h2{
    font-size:11px;color:var(--mute);letter-spacing:.14em;
    text-transform:uppercase;margin:22px 0 8px;font-weight:600;
    display:flex;align-items:center;gap:8px;
  }
  h2::after{content:"";flex:1;height:1px;background:var(--line);}

  /* ── クイック打刻 ── */
  /* ── クイック打刻（v1.22.0 と同じ2列グリッド） ── */
  .quick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;}
  .qbtn{
    position:relative;
    background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:12px 34px 12px 14px;text-align:left;cursor:pointer;color:var(--txt);
    font-family:var(--sans);min-height:64px;min-width:0;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;gap:2px;
  }
  .qbtn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:currentColor;}
  .qbtn:active{background:var(--panel-2);transform:scale(.98);}
  .qbtn .cat{font-size:15px;font-weight:600;line-height:1.3;color:var(--txt);min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .qbtn .pj{font-size:11px;color:var(--mute);min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .qbtn .cat .gtag{width:16px;height:16px;font-size:9px;border-radius:3px;margin-right:5px;}
  .qbtn .star{
    position:absolute;top:6px;right:6px;width:28px;height:28px;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;color:#4C5967;border-radius:8px;
  }
  .qbtn .star.on{color:var(--amber);}
  .qbtn .star:active{background:var(--panel-2);}
  .qbtn.add{align-items:center;justify-content:center;color:var(--amber);border-style:dashed;font-size:22px;padding:12px;}
  .qbtn.add::before{display:none;}
  /* 業務分類の色分け：現場対応＝金色 / それ以外（机・移）＝銀色 */
  .g-field{color:#D6B25E;}
  .g-desk{color:#AFBAC5;}
  .opt.g-field{background:rgba(214,178,94,.13);border-color:rgba(214,178,94,.38);}
  .opt.g-desk{background:rgba(175,186,197,.13);border-color:rgba(175,186,197,.38);}
  .opt .onm{color:var(--txt);font-size:16px;}
  /* 1文字バッジ（現／机／移）。正方形の枠で見出しを短く保つ */
  .gtag{
    display:inline-flex;align-items:center;justify-content:center;
    width:19px;height:19px;font-size:11px;line-height:1;border-radius:4px;
    border:1px solid currentColor;margin-right:6px;font-weight:700;
    flex:0 0 auto;vertical-align:middle;
  }
  .g-field>.gtag,.g-field .gtag,.gtag.g-field{color:#D6B25E;}
  .g-desk>.gtag,.g-desk .gtag,.gtag.g-desk{color:#AFBAC5;}
  /* 打刻の業務分類カード：バッジと分類名を同じ高さで並べ、価値区分は半分の高さで上揃え */
  /* ── 一覧カードの共通形（業務分類・PJ・フェーズで統一）──
     ［1文字バッジ］ 大きな名前 ［小さいタグ］ … ［★］  左に5pxの色帯 */
  .opt.catopt{display:flex;align-items:flex-start;gap:9px;padding:14px 16px;position:relative;overflow:hidden;padding-left:20px;}
  .opt.catopt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:currentColor;}
  .opt.catopt.k-pj{color:#AFBAC5;background:rgba(175,186,197,.10);border-color:rgba(175,186,197,.34);}
  .opt.catopt.k-ph{color:var(--amber);background:rgba(255,176,32,.09);border-color:rgba(255,176,32,.32);}
  .opt.catopt.k-none{color:#5A6673;background:transparent;border-style:dashed;}
  .opt .gtag.big{
    width:30px;height:30px;font-size:18px;border-radius:6px;border-width:2px;
    margin-right:0;align-self:flex-start;
  }
  .opt .gtag.big.num{font-family:var(--mono);font-size:16px;}
  .opt .gtag.big.num.on{background:var(--amber);color:#12161B;border-color:var(--amber);}
  .opt .cnm{
    flex:1 1 auto;min-width:0;color:var(--txt);
    font-size:22px;font-weight:700;line-height:30px;
  }
  .opt.catopt .vtag{
    flex:0 0 auto;align-self:flex-start;margin-right:0;
    height:15px;line-height:13px;font-size:10px;padding:0 6px;
    border:1px solid currentColor;border-radius:4px;display:inline-block;
  }
  /* PJカードのフェーズタグはバッジ・PJ名と同じ高さ（右詰め） */
  .opt.catopt .ctag{
    flex:0 1 auto;min-width:0;align-self:flex-start;margin-right:0;
    height:30px;line-height:26px;font-size:13px;font-weight:700;padding:0 10px;
    border:2px solid currentColor;border-radius:6px;display:inline-block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute);
  }
  .opt.catopt .ctag.on{color:var(--amber);}
  .opt.catopt .ostar{position:static;transform:none;align-self:center;margin-left:2px;flex:0 0 auto;}
  .opt.catopt.reg{cursor:default;}
  .listrow.g-field{border-left:4px solid #D6B25E;}
  .listrow.g-desk{border-left:4px solid #AFBAC5;}
  .listrow .gtag{flex:0 0 auto;}



  /* ── 実績リスト ── */
  .entry{
    display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;
    background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:12px;margin-bottom:8px;
  }
  .entry .time{order:1;font-family:var(--mono);font-size:12px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .entry .dur{order:2;margin-left:auto;}
  .entry .rowbtn,.entry .sentmark{order:3;}
  .entry .body{order:4;flex:1 1 100%;min-width:0;}
  .entry .t1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .entry .t2 .phtag{max-width:none;}
  .entry .t2{font-size:12px;color:var(--mute);margin-top:3px;line-height:1.45;}
  .entry .dur{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--amber);font-variant-numeric:tabular-nums;}
  .entry.sent{opacity:.5;}
  .entry.sent .dur{color:var(--ok);}
  /* 実績行の操作ボタン（大きめ・タップしやすく） */
  .rowbtn{
    flex:0 0 auto;width:40px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);background:var(--panel-2);cursor:pointer;padding:0;
  }
  .rowbtn svg{width:20px;height:20px;}
  .rowbtn.send{background:var(--amber);border-color:var(--amber);}
  .rowbtn.send svg{stroke:#12161B;}
  .rowbtn.send:active{transform:scale(.94);}
  .rowbtn.trash svg{stroke:#5A6673;}
  .rowbtn.trash:active{background:#3A2226;}
  .sentmark{
    flex:0 0 auto;width:40px;height:38px;display:flex;align-items:center;justify-content:center;
    color:var(--ok);
  }
  .sentmark svg{width:20px;height:20px;stroke:var(--ok);}
  .vtag{
    display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;margin-right:5px;
    border:1px solid currentColor;
  }
  .phtag{
    display:inline-block;font-size:10px;padding:1px 6px;margin-left:6px;border-radius:4px;
    background:var(--panel-2);color:var(--mute);border:1px solid var(--line);
    vertical-align:middle;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .v-add{color:var(--ok);}
  .v-keep{color:#6E9CD2;}
  .v-waste{color:#C97A9E;}

  .empty{color:#4C5967;font-size:13px;text-align:center;padding:20px 0;}

  /* ── 今日の実績マトリクス（横:PJ × 縦:業務分類） ── */
  .mtxbtn{
    margin-top:12px;width:100%;padding:13px;border-radius:11px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--txt);
    font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;
  }
  .mtxbtn:active{transform:scale(.99);background:var(--panel);}
  .mtxbtn{white-space:pre-line;line-height:1.5;}
  .mtxbtn.alert{border-color:rgba(255,176,32,.6);color:var(--amber);}
  .mtx-wrap{
    margin-top:12px;overflow:auto;max-height:62vh;-webkit-overflow-scrolling:touch;
    border:1px solid var(--line);border-radius:10px;background:var(--panel);
  }
  .mtx{border-collapse:separate;border-spacing:0;width:100%;font-size:15px;}
  .mtx caption{caption-side:top;text-align:left;font-size:11px;color:var(--mute);padding:8px 10px 4px;}
  .mtx th,.mtx td{padding:11px 12px;white-space:nowrap;border-bottom:1px solid var(--line);}
  .mtx thead th{
    position:sticky;top:0;z-index:2;
    background:var(--panel-2);color:var(--mute);font-weight:600;
    text-align:center;vertical-align:bottom;white-space:normal;line-height:1.2;min-width:60px;
  }
  .mtx tbody th,.mtx tfoot th{
    text-align:left;font-weight:500;color:var(--txt);white-space:normal;line-height:1.2;
    position:sticky;left:0;z-index:1;background:var(--panel);
    min-width:120px;max-width:170px;box-shadow:1px 0 0 var(--line);
  }
  .mtx thead th.cnr{
    position:sticky;left:0;top:0;z-index:3;background:var(--panel-2);
    text-align:left;color:var(--mute);box-shadow:1px 0 0 var(--line);
  }
  .mtx td{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--txt);}
  .mtx td.empty{color:#3A434F;font-family:inherit;}
  .mtx td.z{color:var(--mute);}
  .mtx .tot{color:var(--amber);font-weight:600;}
  .mtx tfoot th,.mtx tfoot td{position:sticky;bottom:0;border-top:2px solid var(--line);border-bottom:none;background:#151B22;}
  .mtx tfoot th{left:0;z-index:2;}

  /* ── 期間切替セグメント ── */
  .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel);}
  .segbtn{
    flex:1;padding:12px 4px;background:transparent;border:none;border-right:1px solid var(--line);
    color:var(--mute);font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer;
  }
  .segbtn:last-child{border-right:none;}
  .segbtn.on{background:var(--amber);color:#12161B;}
  .segbtn:active{background:var(--panel-2);}
  .segbtn.on:active{background:var(--amber);}
  .seg.sub{margin-top:7px;}
  .seg.sub .segbtn{font-size:14px;padding:12px 2px;}
  .seg.sub.q4 .segbtn{font-size:12.5px;padding:12px 1px;letter-spacing:-.02em;}

  /* ── 日付チップ（日ごと表示の日付選択） ── */
  .chips{
    display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:4px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;min-width:76px;padding:8px 8px 6px;border-radius:11px;
    background:var(--panel);border:1px solid var(--line);color:var(--txt);
    font-family:var(--sans);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .chip .d{font-size:12px;font-weight:600;}
  .chip .h{font-family:var(--mono);font-size:14px;color:var(--amber);font-variant-numeric:tabular-nums;}
  .chip .st{font-size:9px;color:var(--mute);line-height:1.2;}
  .chip.none{opacity:.45;}
  .chip.none .h{color:var(--mute);}
  .chip.on{border-color:var(--amber);background:rgba(255,176,32,.12);}
  .chip:active{transform:scale(.97);}

  /* ── マトリクス送信アイコン行 ── */
  .mtxsend{display:flex;gap:10px;justify-content:center;margin-top:14px;}
  .mtxicon{
    flex:0 0 auto;width:74px;padding:10px 0 8px;border-radius:12px;
    display:flex;flex-direction:column;align-items:center;gap:5px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--txt);
    font-family:var(--sans);cursor:pointer;
  }
  .mtxicon svg{width:22px;height:22px;stroke:var(--txt);}
  .mtxicon span{font-size:11px;color:var(--mute);}
  .mtxicon.amber{background:var(--amber);border-color:var(--amber);}
  .mtxicon.amber svg{stroke:#12161B;}
  .mtxicon.amber span{color:#12161B;font-weight:600;}
  .mtxicon:active{transform:scale(.96);}

  /* ── 集計ボックス（月次分析で使用）── */
  .sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .sumcell{
    flex:1 1 calc(33.333% - 4px);min-width:92px;
    background:var(--panel);border:1px solid var(--line);
    border-radius:9px;padding:8px 6px;text-align:center;
  }
  .sumcell.total{border-color:var(--amber);}
  .sumcell .k{font-size:10px;color:var(--mute);line-height:1.25;word-break:break-word;}
  .sumcell .v{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;}

  /* ── 推移グラフ ── */
  .trendwrap{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 6px 6px;}
  .trendwrap svg{display:block;}
  .legend{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:6px 6px 2px;}
  .lg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--mute);}
  .lg i{width:9px;height:9px;border-radius:2px;display:inline-block;}
  .lgnote{margin-left:auto;font-size:10px;color:#5A6673;}

  .selline{margin:10px 0 2px;font-size:14px;}
  .selline .ok{color:var(--ok);font-size:12px;}
  .selline .al{color:var(--amber);font-size:12px;}

  /* ── 数値＋構成比＋増減 ── */
  .hv{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .pv{display:block;font-size:12px;color:var(--mute);font-family:var(--sans);line-height:1.3;margin-top:1px;}
  .dv{display:block;font-size:13px;font-family:var(--mono);line-height:1.3;margin-top:1px;}
  .dv.up{color:#E0A64B;}
  .dv.down{color:#6E9CD2;}
  .dv.flat{color:#5A6673;}
  .mtx td .hv{font-size:20px;font-weight:600;}
  .sumcell .hv{font-size:17px;font-weight:600;}

  /* ── 価値区分の内訳バー ── */
  .vbars{margin-top:12px;}
  .vrow{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .vrow.dim{opacity:.5;}
  .vlab{flex:0 0 56px;font-size:12px;color:var(--mute);text-align:right;}
  .vbar{flex:1;display:flex;height:30px;border-radius:5px;overflow:hidden;background:var(--panel);}
  .vseg{display:flex;align-items:center;justify-content:center;font-size:14px;color:#12161B;font-weight:700;}
  .vseg.add{background:#3FB68B;}
  .vseg.keep{background:#6E9CD2;}
  .vseg.waste{background:#C97A9E;}
  .vempty{font-size:10px;color:#4C5967;padding-left:8px;line-height:20px;}
  .fb{margin-top:10px;font-size:14px;line-height:1.6;color:var(--txt);
      background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);
      border-radius:8px;padding:8px 10px;}
  .pcttoggle{display:flex;justify-content:flex-end;margin-top:12px;}
  .pcttoggle .mini{padding:7px 12px;font-size:12px;}

  /* ── PJ別バー ── */
  .pjrow{margin-bottom:8px;}
  .pjtop{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;margin-bottom:3px;gap:8px;}
  .pjn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pjv{flex:0 0 auto;color:var(--mute);font-family:var(--mono);font-size:15px;display:flex;align-items:baseline;gap:6px;}
  .pjv .dv{display:inline;}
  .pjbar{height:8px;background:var(--panel);border-radius:3px;overflow:hidden;}
  .pjbar span{display:block;height:100%;background:var(--amber);}

  /* ── マトリクス画面：固定ヘッダとページ切替 ── */
  .mtxhead{
    position:sticky;top:-16px;z-index:6;background:var(--bg);
    padding:2px 0 8px;margin:-2px 0 8px;border-bottom:1px solid var(--line);
  }
  .mtxbody{min-height:44vh;}

    <div class="display">

  </div>

<script>
/* ═══════ ストレージ ═══════ */
const KEY='kosu_v1';
let mem=null;
function load(){
  try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}
  return mem||null;
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){mem=JSON.parse(JSON.stringify(S));}
}

/* ═══════ 初期データ ═══════ */
const DEFAULT={
  projects:['開発1','開発2','開発3','生産','定常'],
  pjKind:{'開発1':'dev','開発2':'dev','開発3':'dev','生産':'prod','定常':'std'},
  cats:[
    {n:'現場対応(調査)',v:'add'},
    {n:'現場対応(準備)',v:'add'},
    {n:'現場対応(実行、立ち合い、後片付け)',v:'add'},
    {n:'現場対応(後片付け)',v:'add'},
    {n:'現場対応(設備トラブル、ワークの品質)',v:'add'},
    {n:'現場対応(製造支援)',v:'add'},
    {n:'会議',v:'add'},
    {n:'資料作成(準備)',v:'add'},
    {n:'資料作成(後片づけ)',v:'add'},
    {n:'管理・マネジメント',v:'keep'},
    {n:'メール対応',v:'keep'},
    {n:'トランスクリプト収集・議事録作成',v:'add'},
    {n:'移動',v:'waste'}
  ],
  entries:[],
  running:null,
  mode:'ics',
  alertMin:60
};
let S=load()||JSON.parse(JSON.stringify(DEFAULT));
if(!S.projects) S=JSON.parse(JSON.stringify(DEFAULT));
if(!S.mode) S.mode='outlook';
S.mode='outlook'; // 転送はOutlook直リンクに固定（標準カレンダー方式は廃止）
if(typeof S.alertMin!=='number') S.alertMin=60;
// マトリクスの表示対象（既定：日次・当日）
if(['day','week','month'].indexOf(S.mtxMode)<0) S.mtxMode='day';
if(!S.mtxSent||typeof S.mtxSent!=='object') S.mtxSent={};
if(typeof S.mtxPct!=='boolean') S.mtxPct=true;      // 構成比の表示
if(typeof S.workH!=='number') S.workH=8;            // 1日の所定労働時間（記録カバー率の分母）
if(typeof S.vhTarget!=='number') S.vhTarget=50;     // 投資（付加価値）割合の目標(%)
if(typeof S.wasteTarget!=='number') S.wasteTarget=10; // ムダ割合の上限目標(%)
// PJの種別（PJ名 → 'dev' | 'prod' | 'std'）。フェーズはこの種別から決まる
if(!S.pjKind||typeof S.pjKind!=='object'||Array.isArray(S.pjKind)) S.pjKind={};
// 改善活動は「将来の時間を生む活動」として付加価値（投資）に移行（1回だけ実施）
if(!S.migKaizen){
  const _k=(S.cats||[]).find(c=>c.n==='改善活動');
  if(_k&&_k.v==='keep') _k.v='add';
  S.migKaizen=true;
}

/* ── フェーズ ──────────────────────────────────────────
   打刻キーの区切り文字。v1.26.0 で「PJ|分類」→「PJ|分類|フェーズ」の3要素に変更した。
   既存利用者の★お気に入りは 2要素で保存されているため、初回起動時に一度だけ末尾を補う。 */
const FSEP='\u0001';
const PHASE_NONE='（フェーズ未設定）';
/* PJの種別ごとにフェーズを固定で持つ。表記ゆれを防ぎ、PJをまたいで集計を揃えるため、
   利用者はフェーズ名を編集できない。PJ一覧で種別を選ぶだけでフェーズが決まる。 */
const PJ_KINDS=[
  {k:'dev', n:'開発', phases:['量産化検討','工程計画立案・実施','安全計画立案・実施','法規・人員の手続き',
    '治工具計画立案・実施','設備計画立案・実施','工事管理','物流計画立案・実施','品質計画立案・実施',
    '工試・生試の準備・実施','移行判断','立ち上げ後確認(3か月)']},
  {k:'prod', n:'生産', phases:['継続的改善活動']},
  {k:'std', n:'定常', phases:['育成計画の立案・実施','計画・進捗の管理','会議体の運営']}
];
/* ── PJは「同じ名前でも別物として扱える」よう、1件ずつ id を持つオブジェクトにした（v1.38.0）
   { id, n:名前, k:種別, ph:付与フェーズ（無ければ種別の全量）, fav:★ }                         ── */
function newPjId(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function migProjects(){
  if(!Array.isArray(S.projects)){ S.projects=[]; return; }
  if(S.projects.length && typeof S.projects[0]==='object' && S.projects[0] && S.projects[0].id) return;
  S.projects=S.projects.map(x=>{
    const n=(typeof x==='string')?x:((x&&x.n)||'');
    const o={id:newPjId(), n:n};
    const k=(S.pjKind&&S.pjKind[n])||'';
    if(kindDef(k)) o.k=k;
    const ph=S.pjPhases&&S.pjPhases[n];
    if(Array.isArray(ph)) o.ph=ph.slice();
    if(Array.isArray(S.favPj)&&S.favPj.indexOf(n)>=0) o.fav=true;
    return o;
  }).filter(o=>o.n);
  delete S.pjKind; delete S.pjPhases; delete S.favPj;   // 名前をキーにした旧データは廃止
}
/* 記録（entry.pj）は名前で持つため、集計・編集は「重複を除いた名前」で扱う */
function pjNames(){ const a=[]; S.projects.forEach(p=>{ if(a.indexOf(p.n)<0) a.push(p.n); }); return a; }
function phasesOfName(n){
  const out=[];
  S.projects.filter(p=>p.n===n).forEach(p=>phasesOf(p).forEach(x=>{ if(out.indexOf(x)<0) out.push(x); }));
  return out;
}
function kindOf(p){ return (p&&p.k)||''; }
function kindDef(k){ return PJ_KINDS.find(x=>x.k===k)||null; }
function kindName(k){ const d=kindDef(k); return d?d.n:'未設定'; }
/* 種別の1文字バッジ（業務分類の 現／机／移 と同じ見せ方にそろえる） */
function kindBadge(k){ return k==='dev'?'開':k==='prod'?'生':k==='std'?'定':'－'; }
/* 種別が持つフェーズの全量。番号はこの並びで決まる（付与を外しても番号は変わらない） */
function allPhasesOf(p){ const d=kindDef(kindOf(p)); return d?d.phases:[]; }
/* そのPJに実際に付与されているフェーズ。p.ph が無ければ種別の全量 */
function phasesOf(p){
  const all=allPhasesOf(p);
  if(!p||!Array.isArray(p.ph)) return all;
  return all.filter(x=>p.ph.indexOf(x)>=0);
}
function isPhaseOn(p,ph){ return !p||!Array.isArray(p.ph)||p.ph.indexOf(ph)>=0; }
/* ── PJに登録するフェーズ（v1.40.0）─────────────────────────────
   p.ph の意味
     undefined … 未登録（打刻のときにフェーズ一覧から選ぶ＝従来どおり3タップ）
     [名前]    … 登録済み（打刻は 業務分類 → PJ の2タップ。フェーズは自動で入る）
     []        … フェーズを使わない（2タップ・フェーズ空）
   フェーズは「時期」を表すため、1つのPJに1つだけ登録する。
   時期ごとに分けたいときは、同じ名前のPJを追加して別のフェーズを登録する。 */
function regPhase(p){ return (p&&Array.isArray(p.ph)&&p.ph.length===1)?p.ph[0]:''; }
function phaseState(p){
  if(!kindOf(p)) return 'nokind';
  if(!Array.isArray(p&&p.ph)) return 'unset';
  if(p.ph.length===1) return 'reg';
  if(p.ph.length===0) return 'none';
  return 'multi';   // v1.39以前の複数付与データ
}
/* PJの副題：「開発　1. 量産化検討」のように 種別＋付与したフェーズ名で表す（v1.37.1） */
/* PJカードの小タグ。種別はバッジ（開／生／定）が表すので、フェーズの状態だけを出す */
function pjTagLabel(p){
  const st=phaseState(p);
  if(st==='nokind') return '種別 未設定';
  if(st==='reg')    return phaseNoLabel(regPhase(p));
  if(st==='none')   return 'フェーズなし';
  if(st==='unset')  return 'フェーズ未登録';
  return phasesOf(p).length+'件から選ぶ';
}
function phaseOf(e){ return e&&e.phase?e.phase:''; }
function phaseLabel(p){ return p||PHASE_NONE; }
/* クイック打刻のキー。v1.35.0 で「PJ|業務分類|フェーズ」の3要素に戻した（区切りは FSEP） */
function favKey(pj,cat,phase){ return pj+FSEP+cat+FSEP+(phase||''); }
if(!Array.isArray(S.favs)) S.favs=[];
delete S.favPh;   // v1.36.0 のフェーズ単位★は廃止（v1.37.0）
migProjects();    // v1.38.0：PJを {id,n,k,ph,fav} のオブジェクトへ（旧データからの移行を含む）
/* ── v1.39.0：一度だけ、業務分類を最新の標準セット（13件）に合わせる ──
   端末（URL）ごとに保存された前のバージョンの分類が残り、アプリを更新しても
   古い一覧のままになる問題への対処。記録（S.entries）は触らないので工数は消えない。
   PJ名は各自が実名を登録する運用のため自動では消さず、昔の仮名（プロジェクトA…）のときだけ入れ替える。 */
let _migStdDone='';
if(!S.migStd139){

}

/* フェーズの通し番号（種別ごとの並び順）。表示だけに使い、記録には名前を入れる */
function phaseNo(phase){
  for(let i=0;i<PJ_KINDS.length;i++){
    const j=PJ_KINDS[i].phases.indexOf(phase);
    if(j>=0) return j+1;
  }
  return 0;
}
function phaseNoLabel(phase){
  const no=phaseNo(phase);
  return no? no+'. '+phase : phase;
}
/* 業務分類の色分け：現場対応＝金色 / それ以外（机・移）＝銀色 */
function isGenba(cat){ return String(cat||'').indexOf('現場対応')===0; }
function gClass(cat){ return isGenba(cat)?'g-field':'g-desk'; }
/* いまの業務分類が標準セット（13件）と同じかどうか。古い端末データの検知に使う */
function catsAreStandard(){
  const a=(S.cats||[]).map(c=>c.n), b=DEFAULT.cats.map(c=>c.n);
  return a.length===b.length && a.every((n,i)=>n===b[i]);
}
/* いまのPJ一覧が標準（開発1〜3・生産・定常）と同じかどうか */
function pjsAreStandard(){
  const a=(S.projects||[]).map(p=>p&&p.n), b=DEFAULT.projects;
  return a.length===b.length && a.every((n,i)=>n===b[i]);
}
/* 打刻の選択画面では「現場対応」の接頭辞をバッジ（現）が表すので、名前からは外して大きく見せる */
function catShort(cat){
  const t=String(cat||'');
  if(!isGenba(t)) return t;
  const m=t.match(/^現場対応[（(]?([^）)]*)[）)]?$/);
  const inner=(m&&m[1])?m[1].trim():'';
  return inner||t;
}
/* バッジは1文字。現＝現場対応、移＝移動、机＝それ以外（机上ほか） */
function gLabel(cat){
  if(isGenba(cat)) return '現';
  if(String(cat||'').indexOf('移動')===0) return '移';
  return '机';
}

/* ═══════ ユーティリティ ═══════ */
const pad=n=>String(n).padStart(2,'0');
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes());};
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
function dur(ms){
  const s=Math.floor(ms/1000);
  return Math.floor(s/3600)+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);
}
function hhmm(ms){
  const m=Math.round(ms/60000);
  return Math.floor(m/60)+'h'+pad(m%60);
}
// 小数時間表示（0.1h＝6分刻み）。6分→0.1h、30分→0.5h
function toDecH(ms){return Math.round(ms/3600000/0.1)*0.1;}   // ms→時間(0.1刻み,数値)
function fmtH(v){return (Math.round(v*10)/10).toFixed(1);}    // 数値→"0.5"
function hDec(ms){return fmtH(ms/3600000)+'h';}               // ms→"0.5h"
function catOf(name){return S.cats.find(c=>c.n===name)||{n:name,v:'keep'};}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1900);
}

/* アプリを開いた/前面に戻した時の長時間チェック（主軸：確実に動く） */
function checkStaleOnResume(){
  if(!S.running) return;
  const ms=Date.now()-S.running.start;
  const overMs=(S.alertMin||60)*60000;
  if(ms>=overMs){
    staleSheet();
  }
}
function staleSheet(){
  if(!S.running) return;
  const r=S.running;
  const mins=Math.floor((Date.now()-r.start)/60000);
  const h=Math.floor(mins/60), m=mins%60;
  const dispDur=(h>0?h+'時間':'')+m+'分';
  let html='<h3>⚠ 長時間の計測が続いています</h3>';
  html+='<div class="confirm-card" style="border-color:var(--rec)">'+
     '<div class="cc-cat" style="color:var(--rec)">'+dispDur+' 計測中</div>'+
     '<div class="cc-pj">'+esc(r.cat)+' ／ '+esc(r.pj)+'</div>'+
     '<div class="cc-time">開始 '+hm(r.start)+'</div>'+
     '</div>';
  html+='<button class="closebtn done" style="margin-top:14px" onclick="stopNow()">今すぐストップする</button>';
  html+='<button class="closebtn" onclick="stopAtTime()">別の時刻でストップ（止め忘れ）</button>';
  html+='<button class="closebtn" onclick="closeSheet()">まだ続けている</button>';
  openSheet(html);
}
// 今すぐストップ（通常のストップと同じ→確認シートへ）
function stopNow(){ closeSheet(); stop(false); }
// 実際に終わった時刻を入れて締める
function stopAtTime(){
  if(!S.running){ closeSheet(); return; }
  const r=S.running;
  const iso=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());};
  let html='<h3>終了時刻を入力</h3>';
  html+='<div class="note">実際に作業を終えた時刻を入れてください。その時刻で記録します。</div>';
  html+='<div class="note">開始: '+hm(r.start)+'</div>';
  html+='<input type="datetime-local" id="stEnd" value="'+iso(Date.now())+'">';
  html+='<div class="row2"><button class="mini" onclick="staleSheet()">戻る</button>'+
        '<button class="mini pri" onclick="applyStopAt()">この時刻で記録</button></div>';
  openSheet(html);
}
function applyStopAt(){
  if(!S.running){ closeSheet(); return; }
  const r=S.running;
  const en=new Date(document.getElementById('stEnd').value).getTime();
  if(isNaN(en)||en<=r.start){ toast('開始より後の時刻を入れてください'); return; }
  const newId='e'+en+Math.random().toString(36).slice(2,6);
  S.entries.push({id:newId,pj:r.pj,cat:r.cat,start:r.start,end:en,sent:false});
  S.running=null;_alerted=false;save();render();
  confirmSheet(newId); // そのまま送信確認へ
}

  const ni=document.getElementById('nowitem');
  const st=document.getElementById('state');
  const sb=document.getElementById('stopBtn');

  if(S.running){
    el.classList.remove('idle');

  }else{
    el.classList.add('idle');el.textContent='0:00:00';

  }

  // クイックボタン（★お気に入り固定 → 頻度順 で最大9件）
  const favs=(S.favs||[]).slice();
  const freq={};
  S.entries.slice(-80).forEach(e=>{const k=favKey(e.pj,e.cat,phaseOf(e));freq[k]=(freq[k]||0)+1;});
  const byFreq=Object.keys(freq).filter(k=>favs.indexOf(k)<0).sort((a,b)=>freq[b]-freq[a]);
  // いまの一覧に無いPJ・業務分類（前のバージョンの名前）はボタンに出さない
  const _liveCat=n=>S.cats.some(c=>c.n===n), _livePj=n=>S.projects.some(x=>x.n===n);
  let keys=favs.concat(byFreq).filter(k=>{
    const kp=String(k).split(FSEP);
    return _livePj(kp[0]) && _liveCat(kp[1]);
  }).slice(0,9);
  if(keys.length===0 && S.projects[0] && S.cats[0]){
    keys=[favKey(S.projects[0].n,S.cats[0].n,''), favKey(S.projects[0].n,(S.cats[6]||S.cats[0]).n,'')];
  }
  const q=document.getElementById('quick');
  q.innerHTML='';
  keys.forEach(k=>{
    const kp=String(k).split(FSEP), pj=kp[0], cat=kp[1], phase=kp[2]||'';
    const isFav=favs.indexOf(k)>=0;
    const b=document.createElement('button');
    b.className='qbtn '+gClass(cat);
    const sub=esc(pj)+(phase?'・'+esc(phaseNoLabel(phase)):'');
    b.innerHTML='<span class="cat"><span class="gtag">'+gLabel(cat)+'</span>'+esc(catShort(cat))+'</span><span class="pj">'+sub+'</span>'+
      '<span class="star'+(isFav?' on':'')+'" role="button" aria-label="お気に入り固定">'+(isFav?'★':'☆')+'</span>';
    b.onclick=()=>start(pj,cat,phase);
    b.querySelector('.star').onclick=(ev)=>{ev.stopPropagation();toggleFav(k);};
    q.appendChild(b);
  });
  const add=document.createElement('button');
  add.className='qbtn add';add.textContent='＋';
  add.setAttribute('aria-label','項目を選んで開始');
  add.onclick=pickCat;
  q.appendChild(add);

  // 今日の実績
  const list=todayEntries();
  renderEntries(document.getElementById('entries'), list);

  // マトリクスは別ページ（openMatrix）で表示。ボタンに当日合計を表示
  const mtxBtn=document.getElementById('mtxBtn');
  if(mtxBtn){
    const m=buildMatrix(list);
    const un=unsentDays();
    mtxBtn.textContent = (m.hasData
      ? '🔳　工数マトリクス（PC入力用）　合計 '+fmtH(m.grand)+'h'
      : '🔳　工数マトリクス（PC入力用）を開く')
      + (un.length?'\n⚠ '+un.map(dk=>dkText(dk)).join('・')+' が未送信':'');
    mtxBtn.classList.toggle('alert', un.length>0);
  }

  save();
}

// 当日の実績（新しい順）
function todayEntries(){
  const t=dkey(Date.now());
  return S.entries.filter(e=>dkey(e.start)===t).sort((a,b)=>b.start-a.start);
}
/* ── 期間モデル（日次／週次／月次） ───────────────────────────
   記録は削除されないため、期間を選び直せばいつでも再表示・再送信できる */
const MODE_LABEL={day:'日次',week:'週次',month:'月次'};
const PREV_LABEL={day:'前回記録日',week:'先週',month:'先月'};
const PREV_SHORT={day:'前回',week:'先週',month:'先月'};
const WD=['日','月','火','水','木','金','土'];
function dayStart(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function dstart(dk){const p=dk.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).getTime();}
function dkeyOffset(off){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-off);return dkey(d.getTime());}
function dkText(dk){const p=dk.split('-').map(Number);return p[1]+'/'+p[2]+'('+WD[new Date(p[0],p[1]-1,p[2]).getDay()]+')';}
const md_=t=>{const d=new Date(t);return (new Date(t).getMonth()+1)+'/'+new Date(t).getDate();};
function dayEntries(dk){ return S.entries.filter(e=>dkey(e.start)===dk).sort((a,b)=>b.start-a.start); }
function recentDayKeys(n){ const a=[]; for(let i=0;i<(n||7);i++) a.push(dkeyOffset(i)); return a; } // 新しい順
function dayTotalH(dk){ return buildMatrix(dayEntries(dk),'day').grand; }
// マトリクスをOutlookへ送った日の記録（記録単位のsentとは別管理）
function isDaySent(dk){ return !!(S.mtxSent&&S.mtxSent[dk]); }
function markDaySent(dk){ if(!S.mtxSent) S.mtxSent={}; S.mtxSent[dk]=Date.now(); save(); }
function unmarkDaySent(dk){ if(S.mtxSent) delete S.mtxSent[dk]; save(); openMatrix(); render(); }
// 直近7日のうち「記録があるのに未送信」の日（今日は除く＝まだ勤務中のため）
function unsentDays(){
  const today=dkeyOffset(0);
  return recentDayKeys(7).filter(dk=>dk!==today&&dayEntries(dk).length>0&&!isDaySent(dk));
}
// 週キー＝その週の月曜の日付キー
function weekKeyOf(t){const d=dayStart(t),dow=new Date(d).getDay();return dkey(d-((dow+6)%7)*86400000);}
function curKey(mode){const n=Date.now();return mode==='week'?weekKeyOf(n):mode==='month'?monthKey(n):dkey(n);}
function periodSpan(mode,key){
  if(mode==='week'){const f=dstart(key);return {from:f,to:f+7*86400000-1};}
  if(mode==='month'){const p=key.split('-').map(Number);return {from:new Date(p[0],p[1]-1,1).getTime(),to:new Date(p[0],p[1],1).getTime()-1};}
  const f=dstart(key); return {from:f,to:f+86399999};
}
function periodEntries(mode,key){
  const s=periodSpan(mode,key);
  return S.entries.filter(e=>e.start>=s.from&&e.start<=s.to).sort((a,b)=>b.start-a.start);
}
function periodShort(mode,key){ // グラフの軸ラベル
  if(mode==='week'){const s=periodSpan('week',key);return md_(s.from)+'〜';}
  if(mode==='month'){return Number(key.split('-')[1])+'月';}
  return dkText(key);
}
function periodTitle(mode,key){
  if(mode==='week'){const s=periodSpan('week',key);return md_(s.from)+'〜'+md_(s.to)+' の週';}
  if(mode==='month'){const p=key.split('-');return p[0]+'年'+Number(p[1])+'月';}
  return key+' '+dkText(key);
}
function periodKeys(mode,n){ // 古い→新しい
  const a=[],now=Date.now();
  for(let i=n-1;i>=0;i--){
    if(mode==='week') a.push(dkey(dstart(weekKeyOf(now))-i*7*86400000));
    else if(mode==='month'){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);a.push(monthKey(d.getTime()));}
    else a.push(dkeyOffset(i));
  }
  return a;
}
// 比較対象の期間（日次は直前の「記録がある日」＝土日や休みを飛ばす）
function prevPeriodKey(mode,key){
  if(mode==='week') return dkey(dstart(key)-7*86400000);
  if(mode==='month'){const p=key.split('-').map(Number);return monthKey(new Date(p[0],p[1]-2,1).getTime());}
  const t=dstart(key);
  for(let i=1;i<=21;i++){ const dk=dkey(t-i*86400000); if(dayEntries(dk).length) return dk; }
  return null;
}
/* 集計（ms単位）。マトリクスの丸めとは別に、構成比・比較用に使う */
function agg(list){
  const byV={add:0,keep:0,waste:0},byPj={},byCat={},byPhase={};
  let total=0, phased=0;
  list.forEach(e=>{ const ms=e.end-e.start,c=catOf(e.cat),ph=phaseLabel(phaseOf(e));
    total+=ms; byV[c.v]+=ms; byPj[e.pj]=(byPj[e.pj]||0)+ms; byCat[e.cat]=(byCat[e.cat]||0)+ms;
    byPhase[ph]=(byPhase[ph]||0)+ms; if(phaseOf(e)) phased++; });
  return {total,byV,byPj,byCat,byPhase,phased,days:new Set(list.map(e=>dkey(e.start))).size,n:list.length};
}
// フェーズが1件でも記録されているか（未使用なら出力に節を足さない）
function hasPhase(list){ return list.some(e=>!!phaseOf(e)); }
// フェーズ別の集計行（多い順）。時間は0.1h刻みに丸める
function phaseRows(list){
  const a=agg(list);
  return Object.keys(a.byPhase).sort((x,y)=>a.byPhase[y]-a.byPhase[x])
    .map(k=>({name:k, h:toDecH(a.byPhase[k]), pct:pctOf(a.byPhase[k],a.total)}));
}
function pctOf(part,total){ return total>0?Math.round(part/total*100):0; }
// 期間内の平日数（未来の日は数えない）
function weekdayCount(mode,key){
  const s=periodSpan(mode,key), end=Math.min(s.to,Date.now());
  let n=0;
  for(let t=s.from;t<=end;t+=86400000){ const w=new Date(t).getDay(); if(w!==0&&w!==6) n++; }
  return Math.max(n,0);
}
// 連続記録日数（土日は飛ばす／今日はまだ未記録でも途切れ扱いにしない）
function streakDays(){
  let n=0;
  for(let i=0;i<90;i++){
    const dk=dkeyOffset(i), w=new Date(dstart(dk)).getDay();
    if(dayEntries(dk).length){ n++; continue; }
    if(i===0) continue;
    if(w===0||w===6) continue;
    break;
  }
  return n;
}
// 増減の表示（増＝暖色／減＝寒色。良し悪しは分類によるため中立色）
function diffTag(curH,prevH,unit){
  if(prevH==null) return '';
  const d=Math.round((curH-prevH)*10)/10;
  if(Math.abs(d)<0.05) return '<span class="dv flat">±0</span>';
  return '<span class="dv '+(d>0?'up':'down')+'">'+(d>0?'▲+':'▼')+fmtH(Math.abs(d)*(d>0?1:1))+(unit||'')+'</span>';
}
function diffPt(cur,prev){
  if(prev==null) return '';
  const d=cur-prev;
  if(d===0) return '<span class="dv flat">±0pt</span>';
  return '<span class="dv '+(d>0?'up':'down')+'">'+(d>0?'▲+':'▼')+Math.abs(d)+'pt</span>';
}

/* 現在の選択（日次／週次／月次 × 期間キー）を1か所にまとめる。
   画面表示・CSV・Markdown・Outlook送信はすべてこの情報を参照する */
function validKey(mode,k){
  if(!k) return false;
  const okDay=/^\d{4}-\d{2}-\d{2}$/.test(k), okMon=/^\d{4}-\d{2}$/.test(k);
  if(mode==='month'?!okMon:!okDay) return false;
  return periodSpan(mode,k).from<=Date.now();
}
// 期間を1つ前／後ろへ（未来へは進めない）
function shiftKey(mode,key,delta){
  if(mode==='week') return dkey(dstart(key)+delta*7*86400000);
  if(mode==='month'){const p=key.split('-').map(Number);return monthKey(new Date(p[0],p[1]-1+delta,1).getTime());}
  return dkey(dstart(key)+delta*86400000);
}
function selInfo(){
  const mode=['day','week','month'].indexOf(S.mtxMode)>=0?S.mtxMode:'day';
  const key=validKey(mode,S.mtxKey)?S.mtxKey:curKey(mode);
  const s=periodSpan(mode,key), list=periodEntries(mode,key);
  const title=periodTitle(mode,key);
  const endD=dkey(Math.min(s.to,Date.now()));
  return {mode,key,list,span:s,title,
    caption:'／'+MODE_LABEL[mode]+'：'+title,
    head:title+' の実績マトリクス',
    fileKey:mode==='day'?key:(dkey(s.from)+'_'+endD),
    outDate:mode==='day'?key:endD,
    subject:'#kosu '+MODE_LABEL[mode]+'実績サマリー '+title,
    tagHead:mode==='day'?('#kosu-matrix 日付=['+key+']'):('#kosu-matrix 期間=['+dkey(s.from)+'〜'+dkey(s.to)+']')};
}

// マトリクスHTMLを生成（横:PJ × 縦:業務分類、0.1h刻み、行/列/総合計は丸めセルの合計）
function buildMatrix(list, period='day', capSuffix, opt){
  opt=opt||{};
  const SEPM='\u0001';
  const cellMs={};
  list.forEach(e=>{ const k=e.pj+SEPM+e.cat; cellMs[k]=(cellMs[k]||0)+(e.end-e.start); });
  const pjs=[]; pjNames().forEach(n=>{ if(list.some(e=>e.pj===n)) pjs.push(n); });
  list.forEach(e=>{ if(!pjs.includes(e.pj)) pjs.push(e.pj); });
  const cats=[]; S.cats.forEach(c=>{ if(list.some(e=>e.cat===c.n)) cats.push(c.n); });
  list.forEach(e=>{ if(!cats.includes(e.cat)) cats.push(e.cat); });
  const cellVal={}, rowTot={}, colTot={}; let grand=0; pjs.forEach(p=>colTot[p]=0);
  cats.forEach(cat=>{
    let rt=0;
    pjs.forEach(pj=>{ const k=pj+SEPM+cat; if(cellMs[k]!=null){ const v=toDecH(cellMs[k]); cellVal[k]=v; rt+=v; colTot[pj]+=v; } });
    rowTot[cat]=rt; grand+=rt;
  });
  if(!list.length) return {html:'<div class="empty">まだ記録がありません</div>',grand:0,hasData:false,pjs:[],cats:[],cellVal:{},rowTot:{},colTot:{},SEPM:SEPM};
  const pctv=v=>grand>0?Math.round(v/grand*100):0;
  const maxCell=Math.max.apply(null,[0.1].concat(Object.keys(cellVal).map(k=>cellVal[k])));
  const showPct=!!opt.pct, heat=!!opt.heat;
  let thead='<tr><th class="cnr">業務分類 ＼ PJ</th>';
  pjs.forEach(pj=>{ thead+='<th>'+esc(pj)+'</th>'; });
  thead+='<th class="tot">合計</th></tr>';
  let tbody='';
  cats.forEach(cat=>{
    const vc=catOf(cat).v;
    tbody+='<tr><th>'+esc(cat)+'</th>';
    pjs.forEach(pj=>{
      const v=cellVal[pj+SEPM+cat];
      if(v==null){ tbody+='<td class="empty">–</td>'; return; }
      const bg=heat?' style="background:rgba(255,176,32,'+(0.04+0.28*(v/maxCell)).toFixed(3)+')"':'';
      tbody+='<td'+(v<0.05?' class="z"':'')+bg+'><span class="hv">'+fmtH(v)+'</span>'+
             (showPct?'<span class="pv">'+pctv(v)+'%</span>':'')+'</td>';
    });
    tbody+='<td class="tot"><span class="hv">'+fmtH(rowTot[cat])+'</span>'+
           (showPct?'<span class="pv">'+pctv(rowTot[cat])+'%</span>':'')+
           (opt.prevRow?diffTag(rowTot[cat],opt.prevRow[cat]||0):'')+'</td></tr>';
  });
  let tfoot='<tr><th>合計</th>';
  pjs.forEach(pj=>{ tfoot+='<td class="tot"><span class="hv">'+fmtH(colTot[pj])+'</span>'+
      (showPct?'<span class="pv">'+pctv(colTot[pj])+'%</span>':'')+
      (opt.prevCol?diffTag(colTot[pj],opt.prevCol[pj]||0):'')+'</td>'; });
  tfoot+='<td class="tot"><span class="hv">'+fmtH(grand)+'</span>'+(showPct?'<span class="pv">100%</span>':'')+
      (opt.prevGrand!=null?diffTag(grand,opt.prevGrand):'')+'</td></tr>';
  const caption='単位：h（0.1h＝6分刻み）'+(capSuffix||'');
  const html='<div class="mtx-wrap"><table class="mtx">'+
    '<caption>'+caption+'</caption>'+
    '<thead>'+thead+'</thead><tbody>'+tbody+'</tbody><tfoot>'+tfoot+'</tfoot></table></div>';
  return {html,grand,hasData:true,pjs,cats,cellVal,rowTot,colTot,SEPM};
}

/* 推移グラフ（価値区分の積み上げ棒）。棒をタップするとその期間に切り替わる＝期間選択も兼ねる */
function trendChart(mode,selKey){
  const big=S.mtxView==='chart';
  const n=big?(mode==='day'?10:8):(mode==='day'?7:6);
  const keys=periodKeys(mode,n);
  const data=keys.map(k=>({k,g:agg(periodEntries(mode,k))}));
  const maxH=Math.max.apply(null,[0.5].concat(data.map(d=>d.g.total/3600000)));
  const CW=44, H=big?200:132, TOP=20, BH=big?142:76, BASE=TOP+BH, BW=big?26:24;
  const COL={add:'#3FB68B',keep:'#6E9CD2',waste:'#C97A9E'};
  let g='';
  data.forEach((d,i)=>{
    const x=i*CW+(CW-BW)/2, tot=d.g.total/3600000, on=d.k===selKey;
    if(on) g+='<rect x="'+(i*CW+2)+'" y="'+(TOP-14)+'" width="'+(CW-4)+'" height="'+(H-TOP+6)+'" rx="8" fill="rgba(255,176,32,.10)" stroke="#FFB020" stroke-width="1"/>';
    let y=BASE;
    if(tot>0){
      ['waste','keep','add'].forEach(v=>{
        const hh=(d.g.byV[v]/3600000)/maxH*BH;
        if(hh>0.4){ y-=hh; g+='<rect x="'+x+'" y="'+y.toFixed(1)+'" width="'+BW+'" height="'+hh.toFixed(1)+'" fill="'+COL[v]+'" opacity="'+(on?1:.62)+'"/>'; }
      });
      g+='<text x="'+(x+BW/2)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" font-size="'+(big?13:11)+'" fill="'+(on?'#FFB020':'#7D8894')+'">'+fmtH(tot)+'</text>';
    }else{
      g+='<line x1="'+x+'" y1="'+BASE+'" x2="'+(x+BW)+'" y2="'+BASE+'" stroke="#3A434F" stroke-width="2"/>';
    }
    const unsent=mode==='day'&&tot>0&&d.k!==dkeyOffset(0)&&!isDaySent(d.k);
    g+='<text x="'+(i*CW+CW/2)+'" y="'+(H-12)+'" text-anchor="middle" font-size="'+(big?11.5:10)+'" fill="'+(on?'#E6EDF3':'#7D8894')+'">'+esc(periodShort(mode,d.k))+'</text>';
    if(mode==='day'){
      g+='<text x="'+(i*CW+CW/2)+'" y="'+(H-2)+'" text-anchor="middle" font-size="'+(big?10.5:9)+'" fill="'+(unsent?'#FFB020':'#3FB68B')+'">'+(tot>0?(isDaySent(d.k)?'送信済':(d.k===dkeyOffset(0)?'':'未送信')):'')+'</text>';
    }
    g+='<rect x="'+(i*CW)+'" y="0" width="'+CW+'" height="'+H+'" fill="transparent" style="cursor:pointer" onclick="setMtxKey(\''+d.k+'\')"></rect>';
  });
  return '<div class="trendwrap"><svg viewBox="0 0 '+(n*CW)+' '+H+'" width="100%" height="'+(big?260:132)+'" preserveAspectRatio="xMidYMid meet">'+
         '<line x1="0" y1="'+BASE+'" x2="'+(n*CW)+'" y2="'+BASE+'" stroke="#2E3944" stroke-width="1"/>'+g+'</svg>'+
         '<div class="legend"><span class="lg"><i style="background:#3FB68B"></i>付加価値</span>'+
         '<span class="lg"><i style="background:#6E9CD2"></i>維持管理</span>'+
         '<span class="lg"><i style="background:#C97A9E"></i>ムダ</span>'+
         '<span class="lgnote">棒をタップで期間切替</span></div></div>';
}

/* 価値区分の内訳バー（今回／前回を上下に並べて比較） */
function valueBars(a,pa,prevLabel){
  const row=(g,label,dim)=>{
    if(!g||!g.total) return '<div class="vrow'+(dim?' dim':'')+'"><span class="vlab">'+label+'</span><div class="vbar"><span class="vempty">記録なし</span></div></div>';
    const p=v=>pctOf(g.byV[v],g.total);
    return '<div class="vrow'+(dim?' dim':'')+'"><span class="vlab">'+label+'</span><div class="vbar">'+
      ['add','keep','waste'].map(v=>{
        const w=p(v); if(!w) return '';
        return '<span class="vseg '+v+'" style="width:'+w+'%">'+(w>=12?w+'%':'')+'</span>';
      }).join('')+'</div></div>';
  };
  return '<div class="vbars">'+row(a,'今回')+row(pa,prevLabel,true)+'</div>';
}

/* PJ別の内訳（構成比＋前期間比） */
function pjBars(a,pa){
  const keys=Object.keys(a.byPj).sort((x,y)=>a.byPj[y]-a.byPj[x]);
  if(!keys.length) return '';
  let h='<h2 style="margin:14px 0 6px">PJ別の配分</h2>';
  keys.forEach(k=>{
    const p=pctOf(a.byPj[k],a.total);
    h+='<div class="pjrow"><div class="pjtop"><span class="pjn">'+esc(k)+'</span>'+
       '<span class="pjv">'+fmtH(a.byPj[k]/3600000)+'h ・'+p+'% '+(pa?diffTag(a.byPj[k]/3600000,(pa.byPj[k]||0)/3600000):'')+'</span></div>'+
       '<div class="pjbar"><span style="width:'+p+'%"></span></div></div>';
  });
  return h;
}

/* 一言フィードバック（記入の手応えを言葉にする） */
function feedbackText(mode,a,pa){
  if(!a.total) return '記録がありません。まず1件打刻すると、ここに前回との比較が出ます。';
  const out=[];
  if(pa&&pa.total){
    const dh=(a.total-pa.total)/3600000;
    out.push(PREV_LABEL[mode]+'と比べて合計 '+(dh>=0?'+':'−')+fmtH(Math.abs(dh))+'h');
    const vh=pctOf(a.byV.add,a.total), pvh=pctOf(pa.byV.add,pa.total);
    out.push('付加価値の割合 '+vh+'%（'+(vh-pvh>=0?'+':'−')+Math.abs(vh-pvh)+'pt）');
    const cats={}; Object.keys(a.byCat).forEach(c=>cats[c]=1); Object.keys(pa.byCat).forEach(c=>cats[c]=1);
    let bc=null,bd=0;
    Object.keys(cats).forEach(c=>{ const d=((a.byCat[c]||0)-(pa.byCat[c]||0))/3600000; if(Math.abs(d)>Math.abs(bd)){bd=d;bc=c;} });
    if(bc&&Math.abs(bd)>=0.1) out.push('変化が大きいのは「'+bc+'」'+(bd>0?'+':'−')+fmtH(Math.abs(bd))+'h');
  }else{
    out.push('比較できる'+PREV_LABEL[mode]+'の記録がありません');
  }
  return out.join('　／　');
}

/* ページ4：配分（円グラフ） */
const PIE_COLORS=['#FFB020','#3FB68B','#6E9CD2','#C97A9E','#9B8AE6','#5FC9C2','#E07A5F','#B0BAC6'];
function setMtxPie(k){ S.mtxPie=k; save(); openMatrix(); }
/* ドーナツ円グラフ（自前SVG）。色に触れると中心に内訳が出る */
let _pieItems=[];
function pieTrim(sname){ return sname.length>7?sname.slice(0,6)+'…':sname; }
function pieShow(i){
  const it=_pieItems[i];
  const t1=document.getElementById('pieT1'), t2=document.getElementById('pieT2'), t3=document.getElementById('pieT3');
  if(!t1) return;
  document.querySelectorAll('.donut .arc').forEach(a=>a.setAttribute('stroke-width', a.getAttribute('data-i')==String(i)?'42':'34'));
  document.querySelectorAll('.lrow').forEach(r=>r.classList.toggle('on', r.getAttribute('data-i')==String(i)));
  if(!it){
    t1.textContent=_pieTotalLabel; t1.setAttribute('font-size','30'); t1.setAttribute('fill','#E6EDF3');
    t2.textContent='時間 合計'; t2.setAttribute('fill','#7D8894'); t3.textContent='タップで内訳';
    t3.setAttribute('fill','#5A6673');
    return;
  }
  t1.textContent=it.pct+'%'; t1.setAttribute('font-size','32'); t1.setAttribute('fill',it.color);
  t2.textContent=pieTrim(it.name); t2.setAttribute('fill','#E6EDF3');
  t3.textContent=it.h+'h'+(it.diff?'　'+it.diff:''); t3.setAttribute('fill','#7D8894');
}
let _pieTotalLabel='';
function donut(items,total,prevSrc,goal){
  const R=64, SW=34, C=2*Math.PI*R, cx=100, cy=100;
  _pieTotalLabel=fmtH(total/3600000)+'h';
  _pieItems=items.map(it=>{
    const dh=prevSrc?Math.round(((it.ms-(prevSrc[it.name]||0))/3600000)*10)/10:null;
    return {name:it.name,color:it.color,pct:pctOf(it.ms,total),h:fmtH(it.ms/3600000),
      diff:(dh==null)?'':(Math.abs(dh)<0.05?'±0':(dh>0?'▲+':'▼')+fmtH(Math.abs(dh)))};
  });
  let off=0, arcs='';
  items.forEach((it,i)=>{
    const frac=total>0?it.ms/total:0, len=C*frac;
    if(len<=0) return;
    arcs+='<circle class="arc" data-i="'+i+'" cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="'+it.color+'" stroke-width="'+SW+'"'+
          ' stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"'+
          ' transform="rotate(-90 '+cx+' '+cy+')" style="cursor:pointer"'+
          ' onmouseenter="pieShow('+i+')" onmouseleave="pieShow(-1)"'+
          ' onclick="pieShow('+i+')" ontouchstart="pieShow('+i+')"></circle>';
    off+=len;
  });
  let mark='';
  if(goal!=null&&goal>0&&goal<100){
    const ang=-90+goal*3.6, rad=ang*Math.PI/180;
    const x1=cx+Math.cos(rad)*(R-SW/2-3), y1=cy+Math.sin(rad)*(R-SW/2-3);
    const x2=cx+Math.cos(rad)*(R+SW/2+3), y2=cy+Math.sin(rad)*(R+SW/2+3);
    mark='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'"'+
         ' stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="3 2"></line>'+
         '<text x="'+(cx+Math.cos(rad)*(R+SW/2+13)).toFixed(1)+'" y="'+(cy+Math.sin(rad)*(R+SW/2+13)+4).toFixed(1)+'"'+
         ' text-anchor="middle" font-size="10" fill="#FFFFFF">目標</text>';
  }
  return '<div class="donutwrap"><svg class="donut" viewBox="0 0 200 200" width="176" height="176">'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="#232C36" stroke-width="'+SW+'"></circle>'+arcs+mark+
    '<text id="pieT1" x="100" y="95" text-anchor="middle" font-size="30" font-weight="700" fill="#E6EDF3">'+_pieTotalLabel+'</text>'+
    '<text id="pieT2" x="100" y="113" text-anchor="middle" font-size="12" fill="#7D8894">時間 合計</text>'+
    '<text id="pieT3" x="100" y="129" text-anchor="middle" font-size="11" fill="#5A6673">タップで内訳</text>'+
    '</svg></div>';
}
const VAL_NAME={add:'投資',keep:'現状維持',waste:'ムダ'};
const VAL_COLOR={add:'#3FB68B',keep:'#6E9CD2',waste:'#C97A9E'};
function viewBreakdown(sel,a,pa){
  const kind=['pj','cat','val','phase'].indexOf(S.mtxPie)>=0?S.mtxPie:'pj';
  let h='<div class="seg sub q4">'+[['pj','PJ別'],['cat','業務分類別'],['val','価値区分別'],['phase','フェーズ別']].map(k=>
     '<button class="segbtn'+(kind===k[0]?' on':'')+'" onclick="setMtxPie(\''+k[0]+'\')">'+k[1]+'</button>').join('')+'</div>';
  if(!a.total) return h+'<div class="empty">まだ記録がありません</div>';
  let items,psrc;
  if(kind==='val'){
    // 投資（付加価値）／現状維持（維持管理）／ムダ。順序は固定して見比べやすくする
    items=['add','keep','waste'].filter(v=>a.byV[v]>0).map(v=>({name:VAL_NAME[v],ms:a.byV[v],color:VAL_COLOR[v],v:v}));
    psrc=pa?{投資:pa.byV.add,現状維持:pa.byV.keep,ムダ:pa.byV.waste}:null;
  }else{
    const src=kind==='pj'?a.byPj:kind==='phase'?a.byPhase:a.byCat;
    psrc=pa?(kind==='pj'?pa.byPj:kind==='phase'?pa.byPhase:pa.byCat):null;
    items=Object.keys(src).sort((x,y)=>src[y]-src[x]).map((k,i)=>({
      name:k, ms:src[k], color:PIE_COLORS[i%PIE_COLORS.length], v:kind==='cat'?catOf(k).v:null }));
  }
  if(kind==='phase'&&!hasPhase(sel.list||[])){
  }
  h+=donut(items,a.total,psrc,kind==='val'?(S.vhTarget||50):null);
  h+='<div class="pielegend">';
  items.forEach(it=>{
    const pc=pctOf(it.ms,a.total);
    h+='<div class="lrow" data-i="'+items.indexOf(it)+'" onclick="pieShow('+items.indexOf(it)+')"><span class="lc" style="background:'+it.color+'"></span>'+
       (it.v&&kind!=='val'?'<span class="lv vtag '+VCLASS[it.v]+'">'+VLABEL[it.v].slice(0,2)+'</span>':'')+
       '<span class="ln">'+esc(it.name)+'</span>'+
       '<span class="lp">'+pc+'%</span>'+
       '<span class="lh">'+fmtH(it.ms/3600000)+'h</span>'+
       '<span class="ld">'+(psrc?diffTag(it.ms/3600000,(psrc[it.name]||0)/3600000):'')+'</span></div>';
    if(kind==='val'&&it.v!=='keep'){
      const tg=it.v==='add'?(S.vhTarget||50):(S.wasteTarget||0);
      const gap=it.v==='add'?(pc-tg):(tg-pc);   // プラスなら達成
      h+='<div class="goalrow'+(gap>=0?' ok':' ng')+'">'+
         (it.v==='add'?'目標 '+tg+'%以上':'上限 '+tg+'%以下')+
         '<span>'+(gap>=0?'✓ 達成（余裕 '+Math.abs(gap)+'pt）':(it.v==='add'?'あと '+Math.abs(gap)+'pt':'超過 '+Math.abs(gap)+'pt'))+'</span></div>';
    }
  });
  h+='</div>';
  if(kind==='val'){
    const target=S.vhTarget||50, wt=(S.wasteTarget||0), vh=pctOf(a.byV.add,a.total), wp=pctOf(a.byV.waste,a.total);
    const need=Math.max(0,target-vh), over=Math.max(0,wp-wt);
    h+='<div class="fb">'+
       (need===0&&over===0?'✓ 投資・ムダとも目標を満たしています':
        '目標まで '+(need?'投資 +'+need+'pt（'+fmtH(need*a.total/3600000/100)+'h）':'')+
        (need&&over?' ／ ':'')+(over?'ムダ −'+over+'pt（'+fmtH(over*a.total/3600000/100)+'h）':''))+'</div>';
  }
  return h;
}

function openMatrix(){
  const sel=selInfo(), mode=sel.mode, key=sel.key;
  const view=['sum','chart','table','pj'].indexOf(S.mtxView)>=0?S.mtxView:'sum';
  const a=agg(sel.list);
  const pk=prevPeriodKey(mode,key);
  const pa=pk?agg(periodEntries(mode,pk)):null;
  const prevRow={},prevCol={};
  if(pa){ Object.keys(pa.byCat).forEach(c=>prevRow[c]=pa.byCat[c]/3600000);
          Object.keys(pa.byPj).forEach(k=>prevCol[k]=pa.byPj[k]/3600000); }
  const showPct=S.mtxPct!==false;
  const m=buildMatrix(sel.list, mode, sel.caption,
      {pct:showPct, heat:true, prevRow:pa?prevRow:null, prevCol:pa?prevCol:null,
       prevGrand:pa?pa.total/3600000:null});

  // ── 固定ヘッダ（期間タブ＋期間ナビ＋ページ切替） ──
  let h='<div class="mtxhead">';
  h+='<div class="seg">'+['day','week','month'].map(md=>
      '<button class="segbtn'+(md===mode?' on':'')+'" onclick="setMtxMode(\''+md+'\')">'+MODE_LABEL[md]+'</button>').join('')+'</div>';
  const isNow=key===curKey(mode), canNext=validKey(mode,shiftKey(mode,key,1));
  h+='<div class="pnav">'+
     '<button class="navbtn" onclick="stepPeriod(-1)" aria-label="前へ">‹</button>'+
     '<div class="pttl"><b>'+esc(sel.title)+'</b>'+
       (mode==='day'&&!isNow?'<span class="'+(isDaySent(key)?'ok':'al')+'">'+(isDaySent(key)?'✓ 送信済':'⚠ 未送信')+'</span>':'')+
       '<span class="ptot">'+fmtH(a.total/3600000)+'h'+(pa?' '+diffTag(a.total/3600000,pa.total/3600000,'h').replace('class="dv','class="dvi'):'')+'</span></div>'+
     '<button class="navbtn'+(canNext?'':' off')+'" onclick="stepPeriod(1)" aria-label="次へ">›</button>'+
     '</div>';
  if(!isNow) h+='<button class="nowbtn" onclick="jumpNow()">'+(mode==='day'?'今日':mode==='week'?'今週':'今月')+'へ戻る</button>';
  h+='<div class="seg sub">'+[['sum','サマリー'],['chart','グラフ'],['table','表'],['pj','配分']].map(v=>
      '<button class="segbtn'+(v[0]===view?' on':'')+'" onclick="setMtxView(\''+v[0]+'\')">'+v[1]+'</button>').join('')+'</div>';
  h+='</div>';

  // ── 未送信の案内（サマリーページのみ） ──
  const un=unsentDays();
  if(view==='sum'&&un.length){
    h+='<div class="warn slim">⚠ 未送信 '+un.length+'日：'+un.map(dk=>dkText(dk)).join('・')+'（‹ › で移動）</div>';
  }

  h+='<div class="mtxbody">';
  if(view==='sum') h+=viewSummary(sel,a,pa,m);
  else if(view==='chart') h+=viewChart(sel);
  else if(view==='table') h+=viewTable(sel,m,showPct);
  else h+=viewBreakdown(sel,a,pa);
  h+='</div>';

  h+='<button class="closebtn done" onclick="closeSheet()">閉じる</button>';
  openSheet(h);
}

/* ── 今日のマトリクスを Outlook（終日予定）／CSV／MDへ ── */
function matrixRows(m){
  // [業務分類, {pj: value...}, 行合計] の配列（cats順）
  return m.cats.map(cat=>{
    const row={};
    m.pjs.forEach(pj=>{ const v=m.cellVal[pj+m.SEPM+cat]; if(v!=null) row[pj]=v; });
    return {cat,row,tot:m.rowTot[cat]};
  });
}
function matrixExportCsv(){
  const sel=selInfo();
  const m=buildMatrix(sel.list, sel.mode, sel.caption, {pct:false});
  if(!m.hasData){ toast('この期間の記録がありません'); return; }
  const pc=v=>m.grand>0?Math.round(v/m.grand*100)+'%':'';
  let csv='\ufeff業務分類,'+m.pjs.map(csvCell).join(',')+',合計,構成比\r\n';
  matrixRows(m).forEach(r=>{
    csv+=csvCell(r.cat)+','+m.pjs.map(pj=>r.row[pj]!=null?fmtH(r.row[pj]):'').join(',')+','+fmtH(r.tot)+','+pc(r.tot)+'\r\n';
  });
  csv+='合計,'+m.pjs.map(pj=>fmtH(m.colTot[pj])).join(',')+','+fmtH(m.grand)+',100%\r\n';
  csv+='構成比,'+m.pjs.map(pj=>pc(m.colTot[pj])).join(',')+',100%,\r\n';
  if(hasPhase(sel.list)){
    csv+='\r\nフェーズ,時間,構成比\r\n';
    phaseRows(sel.list).forEach(r=>{ csv+=csvCell(r.name)+','+fmtH(r.h)+','+r.pct+'%\r\n'; });
  }
  downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),'kosu_matrix_'+sel.fileKey+'.csv');
  toast(sel.title+' のマトリクスをCSVで書き出しました');
}
function matrixMdText(m, sel){
  const pc=v=>m.grand>0?Math.round(v/m.grand*100)+'%':'';
  const a=agg(sel.list), pk=prevPeriodKey(sel.mode,sel.key), pa=pk?agg(periodEntries(sel.mode,pk)):null;
  let md='# 工数マトリクス '+sel.title+'\n\n';
  md+='- 合計: '+fmtH(m.grand)+'h';
  if(pa&&pa.total) md+='（'+PREV_LABEL[sel.mode]+'比 '+((a.total-pa.total)>=0?'+':'−')+fmtH(Math.abs(a.total-pa.total)/3600000)+'h）';
  md+='\n- 付加価値の割合: '+pctOf(a.byV.add,a.total)+'%';
  if(pa&&pa.total) md+='（'+PREV_LABEL[sel.mode]+' '+pctOf(pa.byV.add,pa.total)+'%）';
  md+='\n- 内訳: 付加価値 '+pctOf(a.byV.add,a.total)+'% / 維持管理 '+pctOf(a.byV.keep,a.total)+'% / ムダ '+pctOf(a.byV.waste,a.total)+'%\n\n';
  md+='| 業務分類 ＼ PJ | '+m.pjs.join(' | ')+' | 合計 | 構成比 |\n';
  md+='|---|'+m.pjs.map(()=>'--:').join('|')+'|--:|--:|\n';
  matrixRows(m).forEach(r=>{
    md+='| '+r.cat+' | '+m.pjs.map(pj=>r.row[pj]!=null?fmtH(r.row[pj]):'–').join(' | ')+' | '+fmtH(r.tot)+' | '+pc(r.tot)+' |\n';
  });
  md+='| **合計** | '+m.pjs.map(pj=>'**'+fmtH(m.colTot[pj])+'**').join(' | ')+' | **'+fmtH(m.grand)+'** | 100% |\n';
  md+='| 構成比 | '+m.pjs.map(pj=>pc(m.colTot[pj])).join(' | ')+' | 100% |  |\n';
  if(hasPhase(sel.list)){
    md+='\n## フェーズ別\n\n| フェーズ | 時間 | 構成比 |\n|---|--:|--:|\n';
    phaseRows(sel.list).forEach(r=>{ md+='| '+r.name+' | '+fmtH(r.h)+' | '+r.pct+'% |\n'; });
  }
  return md;
}
function matrixExportMd(){
  const sel=selInfo();
  const m=buildMatrix(sel.list, sel.mode, sel.caption, {pct:false});
  if(!m.hasData){ toast('この期間の記録がありません'); return; }
  const md=matrixMdText(m, sel)+'\n---\n_工数タイムレコーダー ver.1.41.1 より出力_\n';
  downloadBlob(new Blob([md],{type:'text/markdown;charset=utf-8'}),'kosu_matrix_'+sel.fileKey+'.md');
  toast(sel.title+' のマトリクスをMarkdownで書き出しました');
}
// Outlook本文用：プロジェクトごとに読みやすくまとめたテキスト（表崩れ対策のため罫線表は使わない）
// Outlook本文用：見たままの罫線表（HTML）で送る。予定の本文欄はHTMLとして解釈されるため実際の表になる
function matrixBodyHtml(m, sel){
  const a=agg(sel.list), pk=prevPeriodKey(sel.mode,sel.key), pa=pk?agg(periodEntries(sel.mode,pk)):null;
  let html='<div style="font-family:Segoe UI,Meiryo,sans-serif;font-size:13px;color:#222;">';
  html+='<p style="margin:0 0 4px;font-weight:bold;">'+sel.head+'　合計 '+fmtH(m.grand)+'h</p>';
  html+='<p style="margin:0 0 8px;color:#555;">付加価値 '+pctOf(a.byV.add,a.total)+'％ ／ 維持管理 '+pctOf(a.byV.keep,a.total)+'％ ／ ムダ '+pctOf(a.byV.waste,a.total)+'％'+
        ((pa&&pa.total)?('　（'+PREV_LABEL[sel.mode]+'比 合計 '+((a.total-pa.total)>=0?'+':'−')+fmtH(Math.abs(a.total-pa.total)/3600000)+'h／付加価値 '+((pctOf(a.byV.add,a.total)-pctOf(pa.byV.add,pa.total))>=0?'+':'−')+Math.abs(pctOf(a.byV.add,a.total)-pctOf(pa.byV.add,pa.total))+'pt）'):'')+'</p>';
  html+='<table style="border-collapse:collapse;font-size:12px;" cellpadding="6" cellspacing="0">';
  html+='<tr><th style="border:1px solid #999;background:#f2f2f2;text-align:left;">業務分類＼PJ</th>';
  m.pjs.forEach(pj=>{ html+='<th style="border:1px solid #999;background:#f2f2f2;text-align:center;">'+esc(pj)+'</th>'; });
  html+='<th style="border:1px solid #999;background:#f2f2f2;text-align:center;">合計</th></tr>';
  matrixRows(m).forEach(r=>{
    html+='<tr><td style="border:1px solid #ccc;">'+esc(r.cat)+'</td>';
    m.pjs.forEach(pj=>{
      const v=r.row[pj];
      html+='<td style="border:1px solid #ccc;text-align:right;'+(v==null?'color:#bbb;':'')+'">'+(v==null?'–':fmtH(v))+'</td>';
    });
    html+='<td style="border:1px solid #ccc;text-align:right;font-weight:bold;">'+fmtH(r.tot)+'</td></tr>';
  });
  html+='<tr><td style="border:1px solid #999;font-weight:bold;background:#f8f8f8;">合計</td>';
  m.pjs.forEach(pj=>{ html+='<td style="border:1px solid #999;text-align:right;font-weight:bold;background:#f8f8f8;">'+fmtH(m.colTot[pj])+'</td>'; });
  html+='<td style="border:1px solid #999;text-align:right;font-weight:bold;background:#f8f8f8;">'+fmtH(m.grand)+'</td></tr>';
  html+='</table>';
  if(hasPhase(sel.list)){
    html+='<p style="margin:12px 0 4px;font-weight:bold;">フェーズ別</p>';
    html+='<table style="border-collapse:collapse;font-size:12px;" cellpadding="6" cellspacing="0">';
    html+='<tr><th style="border:1px solid #999;background:#f2f2f2;text-align:left;">フェーズ</th>'+
          '<th style="border:1px solid #999;background:#f2f2f2;text-align:center;">時間</th>'+
          '<th style="border:1px solid #999;background:#f2f2f2;text-align:center;">構成比</th></tr>';
    phaseRows(sel.list).forEach(r=>{
      html+='<tr><td style="border:1px solid #ccc;">'+esc(r.name)+'</td>'+
            '<td style="border:1px solid #ccc;text-align:right;">'+fmtH(r.h)+'</td>'+
            '<td style="border:1px solid #ccc;text-align:right;">'+r.pct+'%</td></tr>';
    });
    html+='</table>';
  }
  html+='</div>';
  return html;
}
function matrixTagLines(m, sel){
  const tags=[sel.tagHead];
  m.pjs.forEach(pj=>{
    m.cats.forEach(cat=>{
      const v=m.cellVal[pj+m.SEPM+cat];
      if(v!=null) tags.push('#kosu-matrix PJ=['+pj+'] 分類=['+cat+'] 時間h=['+fmtH(v)+']');
    });
  });
  if(hasPhase(sel.list)) phaseRows(sel.list).forEach(r=>{
    tags.push('#kosu-matrix フェーズ=['+r.name+'] 時間h=['+fmtH(r.h)+']');
  });
  return tags.map(esc).join('<br>');
}
// 終日の予定として登録（予定表の一番上に表示され、後から見つけやすい）
function matrixOutlookUrl(m, sel){
  const tagsHtml='<div style="font-size:10px;color:#999;margin-top:12px;">'+matrixTagLines(m,sel)+'</div>';
  const p=new URLSearchParams({
    path:'/calendar/action/compose',
    rru:'addevent',
    subject:sel.subject,
    startdt:sel.outDate,   // 日ごとの場合は「その日」に終日予定として登録される（前日分の後追い送信に対応）
    enddt:sel.outDate,
    allday:'true',
    body:matrixBodyHtml(m,sel)+tagsHtml
  });
  return 'https://outlook.office.com/calendar/0/deeplink/compose?'+p.toString();
}
function matrixSendOutlook(){
  if(_outlookSendLock) return;
  const sel=selInfo();
  const m=buildMatrix(sel.list, sel.mode, sel.caption, {pct:false});
  if(!m.hasData){ toast('この期間の記録がありません'); return; }
  withOutlookSendLock(()=>{
    openOutlookUrl(matrixOutlookUrl(m, sel));
    if(sel.mode==='day'){ markDaySent(sel.dk); openMatrix(); render(); }
  });
}

function matrixMonthlyOutlookUrl(m, mk){
  const tagsHtml='<div style="font-size:10px;color:#999;margin-top:12px;">'+matrixMonthlyTagLines(m,mk)+'</div>';

function start(pj,cat,phase){
  if(S.running){ if(!confirm('計測中の「'+S.running.cat+'」を終了して切り替えますか？')) return; stop(true); }
  S.running={pj,cat,phase:phase||'',start:Date.now()};
  _alerted=false;
  save();render();
  if(navigator.vibrate) navigator.vibrate(12);
  toast('▶ '+cat+' 開始');
}
function stop(silent){
  if(!S.running) return;
  const r=S.running,end=Date.now();
  let newId=null;
  if(end-r.start>=30000){
    newId='e'+end+Math.random().toString(36).slice(2,6);
    S.entries.push({id:newId,pj:r.pj,cat:r.cat,phase:phaseOf(r),start:r.start,end,sent:false});
  }else if(!silent){
    toast('30秒未満のため記録しません');
  }
  S.running=null;save();render();
  _alerted=false;
  if(navigator.vibrate) navigator.vibrate([12,60,12]);
  // 切替(silent)でなく、記録できたときは確認シートを出す
  if(!silent && newId){ confirmSheet(newId); }
}

/* ═══════ カレンダー転送（.ics） ═══════ */
function icsTime(t){
  const d=new Date(t);
  return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+
         pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z';
}
function fold(s){ // RFC5545 75オクテット折返し（簡易）
  return s.length<=74?s:s.match(/.{1,74}/g).join('\r\n ');
}
/* 予定の件名。先頭に選別キーワード #kosu を付与（Outlookエクスポート時に件名だけで抽出できる） */
function subjectOf(e){
  const ph=phaseOf(e);
  return '#kosu ['+e.pj+']['+e.cat+']'+(ph?'【'+ph+'】':'');
}
/* 分析用の機械可読タグ行。後でCSV/正規表現で確実に拾える形 */
function tagLine(e){
  const c=catOf(e.cat);
  const min=Math.round((e.end-e.start)/60000);
  return '#kosu PJ=['+e.pj+'] 分類=['+e.cat+'] フェーズ=['+phaseOf(e)+'] 価値=['+VLABEL[c.v]+'] 分=['+min+']';
}
/* 人が読む本文（1行目）＋機械可読行（2行目） */
function bodyLines(e){
  const c=catOf(e.cat);
  const ph=phaseOf(e);
  return ['PJ: '+e.pj+' ／ 分類: '+e.cat+(ph?' ／ フェーズ: '+ph:'')+' ／ 価値区分: '+VLABEL[c.v]+' ／ 工数: '+hhmm(e.end-e.start),
          tagLine(e)];
}
function buildIcs(list){
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//kosu-timecard//JP\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\n';
  list.forEach(e=>{
    const c=catOf(e.cat);
    const desc=bodyLines(e).join('\\n');
    ics+='BEGIN:VEVENT\r\n'
      +'UID:'+e.id+'@kosu-timecard\r\n'
      +'DTSTAMP:'+icsTime(Date.now())+'\r\n'
      +'DTSTART:'+icsTime(e.start)+'\r\n'
      +'DTEND:'+icsTime(e.end)+'\r\n'
      +fold('SUMMARY:'+subjectOf(e))+'\r\n'
      +fold('DESCRIPTION:'+desc)+'\r\n'
      +'CATEGORIES:'+VLABEL[c.v]+'\r\n'
      +'TRANSP:OPAQUE\r\n'
      +'END:VEVENT\r\n';
  });
  return ics+'END:VCALENDAR\r\n';
}

/* 環境判定 */
const CAN_SHARE=(()=>{ try{ return !!(navigator.canShare && navigator.canShare({files:[new File([''],'t.ics',{type:'text/calendar'})]})); }catch(e){ return false; } })();
function showWarn(){

    'アプリ内ブラウザやプレビューでは共有シートがブロックされます。<b>Safariで開き直す</b>か、'+
    '設定（⚙）で転送方法を<b>「Outlook直リンク」</b>に切り替えてください。</div>';
}

/* ── 方式A: .ics を共有シートで標準カレンダーへ ── */
async function shareIcs(list){
  if(!CAN_SHARE){
    toast('この環境では共有できません。設定を確認してください');
    return false;
  }
  const ics=buildIcs(list);
  const name='kosu_'+dkey(Date.now())+'.ics';
  const file=new File([ics],name,{type:'text/calendar'});
  try{
    await navigator.share({files:[file]});
    return true;
  }catch(err){
    if(err && err.name==='AbortError'){ toast('キャンセルしました'); return false; }
    toast('共有に失敗しました（'+((err&&err.name)||'不明')+'）');
    return false;
  }
}

/* ── 方式B: Outlook Web の予定作成画面を直接開く ── */
function tzOffset(t){
  const o=-new Date(t).getTimezoneOffset();
  return (o>=0?'+':'-')+pad(Math.floor(Math.abs(o)/60))+':'+pad(Math.abs(o)%60);
}
function localIso(t){
  const d=new Date(t);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+
         pad(d.getHours())+':'+pad(d.getMinutes())+':00'+tzOffset(t);
}
function outlookUrl(e){
  const p=new URLSearchParams({
    path:'/calendar/action/compose',
    rru:'addevent',
    subject:subjectOf(e),
    startdt:localIso(e.start),
    enddt:localIso(e.end),
    body:bodyLines(e).join('\n')
  });
  return 'https://outlook.office.com/calendar/0/deeplink/compose?'+p.toString();
}

/* ── 転送の入口 ── */
let _outlookSendLock=false; // Outlookへの送信（個別記録／マトリクス共通）の二重実行防止
function withOutlookSendLock(fn){
  if(_outlookSendLock) return false;
  _outlookSendLock=true;
  setTimeout(()=>{_outlookSendLock=false;},2000);
  fn();
  return true;
}
// Outlookのリンクは別ウィンドウで開く（アプリ自体を移動させない）。
// ホーム画面追加アプリでlocation.hrefを使うと、iPhoneでOutlookアプリへの受け渡しと
// 自アプリ内でのページ遷移が両方発生し、画面が二重に残って二重登録につながることがあるため。
function openOutlookUrl(url){
  const w=window.open(url,'_blank');
  if(!w){ location.href=url; } // ポップアップブロック等でwindow.openが失敗した場合のみ従来方式にフォールバック
}
async function sendToCalendar(list){
  if(list.length===0) return;
  if(S.mode==='outlook'){
    if(_outlookSendLock) return; // 連打・二重呼び出しはここで止める
    const e=list.slice().sort((a,b)=>a.start-b.start)[0];
    const rest=list.length-1;
    withOutlookSendLock(()=>{
      e.sent=true;save();render();
      if(rest>0) toast('残り'+rest+'件。戻ってもう一度押してください');
      openOutlookUrl(outlookUrl(e));
    });
    return;
  }
  const ok=await shareIcs(list);
  if(!ok){ render(); return; }
  list.forEach(e=>e.sent=true);
  save();render();
  toast(list.length+'件をカレンダーへ送りました');
}
function sendOne(id){
  const e=S.entries.find(x=>x.id===id);
  if(e) sendToCalendar([e]);
}
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

/* ═══════ 月次出力・分析 ═══════ */
function monthKey(t){const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function csvCell(s){return '"'+String(s).replace(/"/g,'""')+'"';}

/* その月に最も増えた投資（付加価値）活動。前月の記録がなければ、その月の最大の投資活動を返す */
function topInvest(mk){
  const p=mk.split('-').map(Number);
  const prev=monthKey(new Date(p[0],p[1]-2,1).getTime());
  const a=agg(monthlyEntries(mk)), pa=agg(monthlyEntries(prev));
  const addCats=Object.keys(a.byCat).filter(c=>catOf(c).v==='add');
  if(!addCats.length) return null;
  if(pa.total>0){
    let best=null,bd=0;
    addCats.forEach(c=>{ const d=(a.byCat[c]-(pa.byCat[c]||0))/3600000; if(d>bd){bd=d;best=c;} });
    if(best) return {name:best,grew:true,d:bd,h:a.byCat[best]/3600000};
  }
  const top=addCats.sort((x,y)=>a.byCat[y]-a.byCat[x])[0];
  return {name:top,grew:false,d:0,h:a.byCat[top]/3600000};
}
function topInvestText(mk){
  const t=topInvest(mk);
  if(!t) return '';
  return t.grew
    ? '今月いちばん増えた投資活動：「'+t.name+'」 +'+fmtH(t.d)+'h（今月 '+fmtH(t.h)+'h）'
    : '今月いちばん時間を使った投資活動：「'+t.name+'」 '+fmtH(t.h)+'h';
}

function monthlyEntries(mk){
  return S.entries.filter(e=>monthKey(e.start)===mk).sort((a,b)=>a.start-b.start);
}

function exportCsv(mk){
  const list=monthlyEntries(mk);
  if(list.length===0){toast('この月の記録がありません');return;}
  let csv='\ufeff日付,曜日,開始,終了,分,PJ,業務分類,価値区分\r\n';
  const wd=['日','月','火','水','木','金','土'];
  list.forEach(e=>{
    csv+=[dkey(e.start),wd[new Date(e.start).getDay()],hm(e.start),hm(e.end),
      Math.round((e.end-e.start)/60000),csvCell(e.pj),csvCell(e.cat),VLABEL[catOf(e.cat).v]].join(',')+'\r\n';
  });
  downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),'kosu_'+mk+'.csv');
  toast(mk+' のCSVを書き出しました');
}

function exportMd(mk){
  const list=monthlyEntries(mk);
  if(list.length===0){toast('この月の記録がありません');return;}
  const total=list.reduce((s,e)=>s+(e.end-e.start),0);
  // 集計
  const byV={add:0,keep:0,waste:0};
  const byPj={},byCat={};
  list.forEach(e=>{
    const ms=e.end-e.start,c=catOf(e.cat);
    byV[c.v]+=ms;
    byPj[e.pj]=(byPj[e.pj]||0)+ms;
    byCat[e.cat]=(byCat[e.cat]||0)+ms;
  });
  const pct=ms=>total>0?Math.round(ms/total*100):0;
  const sortDesc=o=>Object.keys(o).sort((a,b)=>o[b]-o[a]);

  let md='# 工数分析 '+mk+'\n\n';
  md+='- 対象期間: '+mk+'\n- 記録件数: '+list.length+'件\n- 合計工数: '+hhmm(total)+'（'+Math.round(total/60000)+'分）\n\n';

  md+='## 価値区分別（バリューアワー）\n\n';
  md+='| 価値区分 | 工数 | 構成比 |\n|---|--:|--:|\n';
  ['add','keep','waste'].forEach(v=>{ md+='| '+VLABEL[v]+' | '+hhmm(byV[v])+' | '+pct(byV[v])+'% |\n'; });
  md+='\n**VH率（付加価値の割合）: '+pct(byV.add)+'%**\n\n';
  const _ti=topInvestText(mk);
  if(_ti) md+='> '+_ti+'\n\n';

  md+='## プロジェクト別\n\n| PJ | 工数 | 構成比 |\n|---|--:|--:|\n';
  sortDesc(byPj).forEach(p=>{ md+='| '+p+' | '+hhmm(byPj[p])+' | '+pct(byPj[p])+'% |\n'; });

  md+='\n## 業務分類別\n\n| 分類 | 価値区分 | 工数 | 構成比 |\n|---|---|--:|--:|\n';
  sortDesc(byCat).forEach(c=>{ md+='| '+c+' | '+VLABEL[catOf(c).v]+' | '+hhmm(byCat[c])+' | '+pct(byCat[c])+'% |\n'; });

  md+='\n---\n_工数タイムレコーダー ver.1.41.1 より出力_\n';
  downloadBlob(new Blob([md],{type:'text/markdown;charset=utf-8'}),'kosu_analysis_'+mk+'.md');
  toast(mk+' の分析Markdownを書き出しました');
}

function monthOpen(){

  const months=[...new Set(S.entries.map(e=>monthKey(e.start)))].sort().reverse();
  const cur=monthKey(Date.now());
  if(!months.includes(cur)) months.unshift(cur);
  const mk=S._selMonth&&months.includes(S._selMonth)?S._selMonth:months[0];
  S._selMonth=mk;

  const list=monthlyEntries(mk);
  const total=list.reduce((s,e)=>s+(e.end-e.start),0);
  const byV={add:0,keep:0,waste:0},byPj={};
  list.forEach(e=>{const ms=e.end-e.start,c=catOf(e.cat);byV[c.v]+=ms;byPj[e.pj]=(byPj[e.pj]||0)+ms;});
  const pct=ms=>total>0?Math.round(ms/total*100):0;

  let h='<h3>月次分析・出力</h3>';
  h+='<select id="mSel" onchange="selMonth(this.value)">'+
     months.map(m=>'<option value="'+m+'"'+(m===mk?' selected':'')+'>'+m+'</option>').join('')+'</select>';

    h+='<div class="note">この月の記録はまだありません。</div>';
  }else{
    h+='<div class="sum" style="margin-bottom:10px">'+
       cell('合計',hhmm(total))+cell('付加価値',hhmm(byV.add))+
       cell('維持管理',hhmm(byV.keep))+cell('ムダ',hhmm(byV.waste))+
       cell('VH率',pct(byV.add)+'%')+'</div>';
    // PJ別 簡易バー
    h+='<h2 style="margin-top:14px">PJ別</h2>';
    Object.keys(byPj).sort((a,b)=>byPj[b]-byPj[a]).forEach(p=>{
      h+='<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">'+
         '<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p)+'</span>'+
         '<span style="color:var(--mute);font-family:var(--mono);flex:0 0 auto;margin-left:8px">'+hhmm(byPj[p])+' ・'+pct(byPj[p])+'%</span></div>'+
         '<div style="height:6px;background:var(--panel);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+pct(byPj[p])+'%;background:var(--amber)"></div></div></div>';
    });
    const _ti=topInvestText(mk);
    if(_ti) h+='<div class="fb">'+esc(_ti)+'</div>';
    h+='<button class="mini pri" style="width:100%;margin-top:12px;" onclick="openMatrixMonthly(\''+mk+'\')">月次マトリクスを表示</button>';
  }

  h+='<div class="row2" style="margin-top:8px"><button class="mini pri" onclick="exportCsv(\''+mk+'\')">CSV出力</button>'+
     '<button class="mini pri" onclick="exportMd(\''+mk+'\')">分析Markdown出力</button></div>';
  h+='<button class="closebtn done" onclick="closeSheet()">閉じる</button>';
  openSheet(h);
}

/* ═══════ バックアップ（書き出し／読み込み） ═══════
   記録はURL（オリジン）ごとに保存されるため、配布先やURLが変わると引き継がれない。
   JSONで丸ごと持ち出し・取り込みできるようにする */
function exportBackup(){
  const data={app:'kosu', appVer:'1.25.0', exportedAt:new Date().toISOString(), state:S};
  downloadBlob(new Blob([JSON.stringify(data)],{type:'application/json'}),'kosu_backup_'+dkey(Date.now())+'.json');
  toast('バックアップを書き出しました');
}
function pickBackup(mode){
  const el=document.getElementById('bkFile');
  if(!el) return;
  el.dataset.mode=mode;
  el.value='';
  el.click();
}
function onBackupPicked(el){
  const f=el.files&&el.files[0];
  if(!f) return;
  const mode=el.dataset.mode||'merge';
  const r=new FileReader();
  r.onload=()=>{
    let d;
    try{ d=JSON.parse(r.result); }catch(e){ toast('読み込めませんでした（JSONではありません）'); return; }
    const st=d&&d.state?d.state:d;
    if(!st||!Array.isArray(st.entries)){ toast('このアプリのバックアップではありません'); return; }
    if(mode==='replace'){
      if(!confirm('この端末の記録をすべて消して、バックアップの内容に置き換えます。よろしいですか？')) return;
      S=JSON.parse(JSON.stringify(st));
      if(!S.mtxSent) S.mtxSent={};
      migProjects();
      save(); render();
      toast('復元しました（記録 '+S.entries.length+'件）');
      closeSheet(); return;
    }
    // マージ：同じ記録は重複させず、PJ・業務分類は不足分だけ追加する
    const key=e=>e.id||(e.pj+'|'+e.cat+'|'+e.start+'|'+e.end);
    const have={}; S.entries.forEach(e=>have[key(e)]=1);
    let add=0;
    st.entries.forEach(e=>{ if(!have[key(e)]){ S.entries.push(e); have[key(e)]=1; add++; } });
    S.entries.sort((a,b)=>a.start-b.start);
    let addPj=0, addCat=0;
    (st.projects||[]).forEach(x=>{
      const n=(typeof x==='string')?x:((x&&x.n)||'');
      if(!n) return;
      const k=((typeof x==='object'&&x&&x.k)||(st.pjKind&&st.pjKind[n])||'');
      const ph=(typeof x==='object'&&x&&Array.isArray(x.ph))?x.ph
              :((st.pjPhases&&Array.isArray(st.pjPhases[n]))?st.pjPhases[n]:null);
      const fav=(typeof x==='object'&&x&&!!x.fav)||(Array.isArray(st.favPj)&&st.favPj.indexOf(n)>=0);
      const same=S.projects.filter(o=>o.n===n);
      if(same.length===0){
        const o={id:newPjId(), n:n};
        if(kindDef(k)) o.k=k;
        if(Array.isArray(ph)) o.ph=ph.slice();
        if(fav) o.fav=true;
        S.projects.push(o); addPj++;
      }else{
        const o=same[0];
        if(!o.k&&kindDef(k)) o.k=k;
        if(!Array.isArray(o.ph)&&Array.isArray(ph)) o.ph=ph.slice();
        if(fav) o.fav=true;
      }
    });
    (st.cats||[]).forEach(c=>{ if(!S.cats.some(x=>x.n===c.n)){ S.cats.push({n:c.n,v:c.v||'keep'}); addCat++; } });
    if(st.mtxSent) Object.keys(st.mtxSent).forEach(k=>{ if(!S.mtxSent[k]) S.mtxSent[k]=st.mtxSent[k]; });
    save(); render();
    toast('取り込みました（記録 +'+add+'件／PJ +'+addPj+'／分類 +'+addCat+'）');
    closeSheet();
  };
  r.readAsText(f);
}

function setAlert(v){S.alertMin=parseInt(v,10)||60;_alerted=false;save();render();}
function setWorkH(v){S.workH=parseFloat(v)||8;save();cfgOpen();}
function setVhTarget(v){S.vhTarget=parseInt(v,10)||50;save();cfgOpen();}
function setWasteTarget(v){S.wasteTarget=parseInt(v,10);if(isNaN(S.wasteTarget))S.wasteTarget=10;save();cfgOpen();}
function addPj(){
  const v=document.getElementById('newPj').value.trim(); if(!v) return;
  S.projects.push({id:newPjId(), n:v});   // 同じ名前でも別の行として追加できる
  save();cfgOpen();render();
}
function delPj(i){
  if(S.projects.length<=1)return;
  S.projects.splice(i,1);   // 種別・付与・★はそのPJの行ごと消える
  save();cfgOpen();render();
}
/* ── PJの種別とフェーズ（フェーズ名は種別ごとに固定。利用者は編集しない） ── */
function setPjKind(pi,k){
  const p=S.projects[pi]; if(!p) return;
  if(k&&kindDef(k)) p.k=k; else delete p.k;
  delete p.ph;   // 種別が変わったらフェーズの付与はやり直し（全部ON）
  save(); cfgOpen(); render();
}
/* PJに使うフェーズを付与する（タップでON/OFF）。フェーズ名そのものは種別ごとに固定 */
function phaseView(pi){
  const p=S.projects[pi]; if(!p) return;
  const k=kindOf(p), all=allPhasesOf(p), f=isFavPj(p), st=phaseState(p);
  let h='<h3>'+esc(p.n)+' のフェーズ登録</h3>';
  h+='<div class="reglabel" style="margin-top:0">種別：'+esc(kindName(k))+'</div>';
  h+='<button class="closebtn'+(f?' done':'')+'" style="margin-top:0" onclick="togFavPjCfg('+pi+',true)">'+
     (f?'★ よく使うPJに固定中（タップで解除）':'☆ よく使うPJに固定する')+'</button>';
  if(all.length===0){
    h+='<div class="empty">種別が未設定です（打刻は 業務分類 → PJ の2タップ）</div>';
  }else if(st==='reg'){
    h+='<div class="reglabel">登録中のフェーズ</div>';
    h+='<div class="opt catopt k-ph reg"><span class="gtag big num on">'+phaseNo(regPhase(p))+'</span>'+
       '<span class="cnm">'+esc(regPhase(p))+'</span></div>';
    h+='<button class="closebtn" style="margin-top:10px" onclick="clearPjPhase('+pi+')">解除して選び直す</button>';
  }else if(st==='none'){
    h+='<div class="reglabel">フェーズを使わない設定です</div>';
    h+='<button class="closebtn" style="margin-top:6px" onclick="clearPjPhase('+pi+')">解除して選び直す</button>';
  }else{
    h+='<div class="reglabel">登録するフェーズを選ぶ</div>';
    all.forEach((x,j)=>h+='<button class="opt catopt k-ph'+(st==='multi'&&isPhaseOn(p,x)?' fav':'')+'" onclick="setPjPhase('+pi+','+j+')">'+
      '<span class="gtag big num">'+phaseNo(x)+'</span><span class="cnm">'+esc(x)+'</span></button>');
    h+='<button class="mini" style="width:100%;margin-top:8px" onclick="setPjNoPhase('+pi+')">このPJはフェーズを使わない</button>';
  }
  h+='<button class="closebtn" onclick="cfgOpen()">設定に戻る</button>';
  openSheet(h);
}
/* 1つ登録する（ほかは自動的に外れる） */
function setPjPhase(pi,j){
  const p=S.projects[pi]; if(!p) return;
  const x=allPhasesOf(p)[j]; if(!x) return;
  p.ph=[x];
  save(); render(); phaseView(pi);
  toast('★ '+phaseNoLabel(x)+' を登録しました');
}
/* 解除＝未登録に戻す（打刻のたびに一覧から選ぶ状態） */
function clearPjPhase(pi){
  const p=S.projects[pi]; if(!p) return;
  delete p.ph;
  save(); render(); phaseView(pi);
  toast('登録を解除しました');
}
function setPjNoPhase(pi){
  const p=S.projects[pi]; if(!p) return;
  p.ph=[];
  save(); render(); phaseView(pi);
  toast('このPJはフェーズを使いません');
}
/* PJ一覧を標準に戻す（v1.38.5）。記録は消えない */
function resetPjs(){
  if(!confirm('PJ一覧を標準の5件（開発1・開発2・開発3・生産・定常）に戻します。\n自分で登録したPJ名は一覧から消えますが、記録済みの工数は消えません。よろしいですか？')) return false;
  S.projects=DEFAULT.projects.map(n=>{
    const o={id:newPjId(), n:n};
    const k=DEFAULT.pjKind[n];
    if(kindDef(k)) o.k=k;
    return o;
  });
  save(); render();
  toast('PJ一覧を標準に戻しました');
  return true;
}
function resetPjsHere(){ if(resetPjs()) pickCat(); }
function resetPjsCfg(){ if(resetPjs()) cfgOpen(); }
/* 打刻画面からそのまま入れ替える（v1.38.4） */
function resetCatsHere(){
  if(!confirm('業務分類を標準の13件に入れ替えます。\n自分で追加した分類は一覧から消えますが、記録済みの工数は消えません。よろしいですか？')) return;
  S.cats=JSON.parse(JSON.stringify(DEFAULT.cats));
  save(); render(); pickCat();
  toast('業務分類を標準セットに入れ替えました');
}
/* 業務分類を標準セットに入れ替える（記録は消えない） */
function resetCats(){
  if(!confirm('業務分類を標準の13件に入れ替えます。\n自分で追加した分類は一覧から消えますが、記録済みの工数は消えません。よろしいですか？')) return;
  S.cats=JSON.parse(JSON.stringify(DEFAULT.cats));
  save(); cfgOpen(); render();
  toast('業務分類を標準セットに入れ替えました');
}
function addCat(){const v=document.getElementById('newCat').value.trim();if(!v)return;S.cats.push({n:v,v:'keep'});save();cfgOpen();render();}
function delCat(i){if(S.cats.length<=1)return;S.cats.splice(i,1);save();cfgOpen();render();}
function setV(i,v){S.cats[i].v=v;save();cfgOpen();render();}

// 起動時は必ず現在の期間を選択（前回選んだ日付・週・月は引き継がない）
S.mtxKey=null;
render();
if(_migStdDone) setTimeout(()=>toast(_migStdDone+'を最新の標準セットに更新しました'),600);
</script>
</body>
</html>
