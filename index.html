<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工数打刻">
<meta name="theme-color" content="#12161B">
<title>工数タイムレコーダー</title>
<!--
  ver.1.51.0 (2026-09-23): Outlookの件名を角かっこ［］だけの7項目・固定順に統一。#kosu [PJ][業務分類][フェーズ][種別][場所][価値区分][フェーズNo]。フェーズは【】をやめて［］にし、フェーズが無いときも [] を残して位置をそろえる。v1.50.0で足した大分類は業務分類と重なるため削除。タグ行も同じ項目に合わせた。
-->
<style>
  :root{
    --bg:#12161B;
    --panel:#1B222A;
    --panel-2:#232C36;
    --line:#2E3944;
    --txt:#E6EDF3;
    --mute:#7D8894;
    --amber:#FFB020;
    --rec:#E5484D;
    --ok:#3FB68B;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--txt);font-family:var(--sans);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 88px) env(safe-area-inset-left);
    min-height:100vh;font-size:15px;line-height:1.5;
  }
  .wrap{max-width:520px;margin:0 auto;padding:12px 14px 24px;}

  /* ── 打刻機ヘッド ── */
  .head{
    background:linear-gradient(180deg,#232C36,#1A2129);
    border:1px solid var(--line);border-radius:14px;
    padding:12px 14px 14px;position:relative;overflow:hidden;flex:0 0 auto;
  }
  .head::before{
    content:"";position:absolute;inset:0 0 auto 0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,176,32,.5),transparent);
  }
  .clockrow{display:flex;align-items:baseline;justify-content:space-between;}
  .clock{font-family:var(--mono);font-size:15px;color:var(--mute);letter-spacing:.04em;font-variant-numeric:tabular-nums;}
  .badge{font-size:11px;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;}

  .display{
    margin-top:8px;text-align:center;
  }
  .elapsed{
    font-family:var(--mono);font-weight:600;
    font-size:clamp(44px,15vw,62px);line-height:1.05;
    color:var(--amber);font-variant-numeric:tabular-nums;
    letter-spacing:.02em;
    text-shadow:0 0 22px rgba(255,176,32,.28);
  }
  .elapsed.idle{color:#3D4855;text-shadow:none;font-size:clamp(30px,9vw,40px);}
  .elapsed.over{color:var(--rec);text-shadow:0 0 22px rgba(229,72,77,.35);}
  .runbanner{
    display:flex;align-items:center;gap:8px;
    margin-top:12px;padding:10px 12px;border-radius:10px;
    background:rgba(229,72,77,.14);border:1px solid rgba(229,72,77,.5);
    color:#F0B4B6;font-size:13px;line-height:1.4;
  }
  .runbanner .rb-icon{font-size:15px;flex:0 0 auto;}
  .nowitem{
    margin-top:4px;font-size:14px;color:var(--txt);min-height:22px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .nowitem .pj{color:var(--mute);}
  .recdot{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--rec);margin-right:6px;vertical-align:middle;
    animation:blink 1.4s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
  @media (prefers-reduced-motion:reduce){.recdot{animation:none}}

  /* ── 大ボタン ── */
  .bigbtn{
    display:block;width:100%;margin-top:14px;
    border:none;border-radius:12px;padding:16px;
    font-size:17px;font-weight:700;letter-spacing:.06em;
    font-family:var(--sans);cursor:pointer;
  }
  .bigbtn.stop{background:var(--rec);color:#fff;box-shadow:0 4px 0 #A6262A;}
  .bigbtn.stop:active{transform:translateY(3px);box-shadow:0 1px 0 #A6262A;}

  /* ── セクション ── */
  h2{
    font-size:11px;color:var(--mute);letter-spacing:.14em;
    text-transform:uppercase;margin:22px 0 8px;font-weight:600;
    display:flex;align-items:center;gap:8px;
  }
  h2::after{content:"";flex:1;height:1px;background:var(--line);}

  /* ── クイック打刻 ── */
  /* ── クイック打刻（v1.22.0 と同じ2列グリッド） ── */
  .quick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;}
  .qbtn{
    position:relative;
    background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:12px 34px 12px 14px;text-align:left;cursor:pointer;color:var(--txt);
    font-family:var(--sans);min-height:64px;min-width:0;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;gap:2px;
  }
  .qbtn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:currentColor;}
  .qbtn:active{background:var(--panel-2);transform:scale(.98);}
  .qbtn .cat{font-size:15px;font-weight:600;line-height:1.3;color:var(--txt);min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .qbtn .pj{font-size:11px;color:var(--mute);min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .qbtn .cat .gtag{width:16px;height:16px;font-size:9px;border-radius:3px;margin-right:5px;}
  .qbtn .star{
    position:absolute;top:6px;right:6px;width:28px;height:28px;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;color:#4C5967;border-radius:8px;
  }
  .qbtn .star.on{color:var(--amber);}
  .qbtn .star:active{background:var(--panel-2);}
  .qbtn.add{align-items:center;justify-content:center;color:var(--amber);border-style:dashed;font-size:22px;padding:12px;}
  .qbtn.add::before{display:none;}
  /* 業務分類の色分け：現場対応＝金色 / それ以外（机・移）＝銀色 */
  .g-field{color:#D6B25E;}
  .g-desk{color:#AFBAC5;}
  .opt.g-field{background:rgba(214,178,94,.13);border-color:rgba(214,178,94,.38);}
  .opt.g-desk{background:rgba(175,186,197,.13);border-color:rgba(175,186,197,.38);}
  .opt .onm{color:var(--txt);font-size:16px;}
  /* 1文字バッジ（現／机／移）。正方形の枠で見出しを短く保つ */
  .gtag{
    display:inline-flex;align-items:center;justify-content:center;
    width:19px;height:19px;font-size:11px;line-height:1;border-radius:4px;
    border:1px solid currentColor;margin-right:6px;font-weight:700;
    flex:0 0 auto;vertical-align:middle;
  }
  .g-field>.gtag,.g-field .gtag,.gtag.g-field{color:#D6B25E;}
  .g-desk>.gtag,.g-desk .gtag,.gtag.g-desk{color:#AFBAC5;}
  /* 打刻の業務分類カード：バッジと分類名を同じ高さで並べ、価値区分は半分の高さで上揃え */
  /* ── 一覧カードの共通形（業務分類・PJ・フェーズで統一）──
     ［1文字バッジ］ 大きな名前 ［小さいタグ］ … ［★］  左に5pxの色帯 */
  .opt.catopt{display:flex;align-items:flex-start;gap:9px;padding:14px 16px;position:relative;overflow:hidden;padding-left:20px;}
  .opt.catopt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:currentColor;}
  .opt.catopt.k-pj{color:#AFBAC5;background:rgba(175,186,197,.10);border-color:rgba(175,186,197,.34);}
  .opt.catopt.k-ph{color:var(--amber);background:rgba(255,176,32,.09);border-color:rgba(255,176,32,.32);}
  .opt.catopt.k-none{color:#5A6673;background:transparent;border-style:dashed;}
  .opt .gtag.big{
    width:30px;height:30px;font-size:18px;border-radius:6px;border-width:2px;
    margin-right:0;align-self:flex-start;
  }
  .opt .gtag.big.num{font-family:var(--mono);font-size:16px;}
  .opt .gtag.big.num.on{background:var(--amber);color:#12161B;border-color:var(--amber);}
  .opt .cnm{
    flex:1 1 auto;min-width:0;color:var(--txt);
    font-size:22px;font-weight:700;line-height:30px;
  }
  .opt.catopt .vtag{
    flex:0 0 auto;align-self:flex-start;margin-right:0;
    height:15px;line-height:13px;font-size:10px;padding:0 6px;
    border:1px solid currentColor;border-radius:4px;display:inline-block;
  }
  /* PJカードのフェーズタグはバッジ・PJ名と同じ高さ（右詰め） */
  .opt.catopt .ctag{
    flex:0 1 auto;min-width:0;align-self:flex-start;margin-right:0;
    height:30px;line-height:26px;font-size:13px;font-weight:700;padding:0 10px;
    border:2px solid currentColor;border-radius:6px;display:inline-block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute);
  }
  .opt.catopt .ctag.on{color:var(--amber);}
  .opt.catopt .ostar{position:static;transform:none;align-self:center;margin-left:2px;flex:0 0 auto;}
  .opt.catopt.reg{cursor:default;}
  .listrow.g-field{border-left:4px solid #D6B25E;}
  .listrow.g-desk{border-left:4px solid #AFBAC5;}
  .listrow .gtag{flex:0 0 auto;}



  /* ── 実績リスト ── */
  .entry{
    display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;
    background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:12px;margin-bottom:8px;
  }
  .entry .time{order:1;font-family:var(--mono);font-size:12px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .entry .dur{order:2;margin-left:auto;}
  .entry .rowbtn,.entry .sentmark{order:3;}
  .entry .body{order:4;flex:1 1 100%;min-width:0;}
  .entry .t1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .entry .t2 .phtag{max-width:none;}
  .entry .t2{font-size:12px;color:var(--mute);margin-top:3px;line-height:1.45;}
  .entry .dur{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--amber);font-variant-numeric:tabular-nums;}
  .entry.sent{opacity:.5;}
  .entry.sent .dur{color:var(--ok);}
  /* 実績行の操作ボタン（大きめ・タップしやすく） */
  .rowbtn{
    flex:0 0 auto;width:40px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);background:var(--panel-2);cursor:pointer;padding:0;
  }
  .rowbtn svg{width:20px;height:20px;}
  .rowbtn.send{background:var(--amber);border-color:var(--amber);}
  .rowbtn.send svg{stroke:#12161B;}
  .rowbtn.send:active{transform:scale(.94);}
  .rowbtn.trash svg{stroke:#5A6673;}
  .rowbtn.trash:active{background:#3A2226;}
  .sentmark{
    flex:0 0 auto;width:40px;height:38px;display:flex;align-items:center;justify-content:center;
    color:var(--ok);
  }
  .sentmark svg{width:20px;height:20px;stroke:var(--ok);}
  .vtag{
    display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;margin-right:5px;
    border:1px solid currentColor;
  }
  .phtag{
    display:inline-block;font-size:10px;padding:1px 6px;margin-left:6px;border-radius:4px;
    background:var(--panel-2);color:var(--mute);border:1px solid var(--line);
    vertical-align:middle;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .v-add{color:var(--ok);}
  .v-keep{color:#6E9CD2;}
  .v-waste{color:#C97A9E;}

  .empty{color:#4C5967;font-size:13px;text-align:center;padding:20px 0;}

  /* ── 今日の実績マトリクス（横:PJ × 縦:業務分類） ── */
  .mtxbtn{
    margin-top:12px;width:100%;padding:13px;border-radius:11px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--txt);
    font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;
  }
  .mtxbtn:active{transform:scale(.99);background:var(--panel);}
  .mtxbtn{white-space:pre-line;line-height:1.5;}
  .mtxbtn.alert{border-color:rgba(255,176,32,.6);color:var(--amber);}
  .mtx-wrap{
    margin-top:12px;overflow:auto;max-height:62vh;-webkit-overflow-scrolling:touch;
    border:1px solid var(--line);border-radius:10px;background:var(--panel);
  }
  .mtx{border-collapse:separate;border-spacing:0;width:100%;font-size:15px;}
  .mtx caption{caption-side:top;text-align:left;font-size:11px;color:var(--mute);padding:8px 10px 4px;}
  .mtx th,.mtx td{padding:11px 12px;white-space:nowrap;border-bottom:1px solid var(--line);}
  .mtx thead th{
    position:sticky;top:0;z-index:2;
    background:var(--panel-2);color:var(--mute);font-weight:600;
    text-align:center;vertical-align:bottom;white-space:normal;line-height:1.2;min-width:60px;
  }
  .mtx tbody th,.mtx tfoot th{
    text-align:left;font-weight:500;color:var(--txt);white-space:normal;line-height:1.2;
    position:sticky;left:0;z-index:1;background:var(--panel);
    min-width:120px;max-width:170px;box-shadow:1px 0 0 var(--line);
  }
  .mtx thead th.cnr{
    position:sticky;left:0;top:0;z-index:3;background:var(--panel-2);
    text-align:left;color:var(--mute);box-shadow:1px 0 0 var(--line);
  }
  .mtx td{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--txt);}
  .mtx td.empty{color:#3A434F;font-family:inherit;}
  .mtx td.z{color:var(--mute);}
  .mtx .tot{color:var(--amber);font-weight:600;}
  .mtx tfoot th,.mtx tfoot td{position:sticky;bottom:0;border-top:2px solid var(--line);border-bottom:none;background:#151B22;}
  .mtx tfoot th{left:0;z-index:2;}

  /* ── 3軸の階層表（業務分類 → PJ → フェーズ／v1.43.0） ── */
  .tri{border-collapse:separate;border-spacing:0;width:100%;font-size:15px;}
  .tri caption{caption-side:top;text-align:left;font-size:11px;color:var(--mute);padding:8px 10px 4px;line-height:1.4;}
  .tri th,.tri td{padding:9px 10px;border-bottom:1px solid var(--line);}
  .tri thead th{
    position:sticky;top:0;z-index:2;background:var(--panel-2);color:var(--mute);
    font-weight:600;text-align:right;white-space:nowrap;
  }
  .tri thead th.cnr{text-align:left;}
  .tri tbody th{text-align:left;font-weight:500;color:var(--txt);white-space:normal;line-height:1.25;}
  .tri td{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--txt);white-space:nowrap;}
  .tri tr.r-cat th,.tri tr.r-cat td{background:var(--panel-2);}
  .tri tr.r-cat th{font-weight:700;}
  .tri tr.r-cat td .hv{font-size:18px;font-weight:700;}
  .tri tr.r-pj th{padding-left:22px;}
  .tri tr.r-pj th::before{content:"┗ ";color:var(--mute);}
  .tri tr.r-ph th{padding-left:40px;color:var(--mute);font-size:13px;}
  .tri tr.r-ph td{color:var(--mute);font-size:13px;}
  .tri .tot{color:var(--amber);font-weight:600;}
  .tri .vtag{margin-right:6px;}
  .tri tfoot th,.tri tfoot td{
    position:sticky;bottom:0;border-top:2px solid var(--line);border-bottom:none;
    background:#151B22;font-weight:700;
  }

  /* ── 期間切替セグメント ── */
  .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel);}
  .segbtn{
    flex:1;padding:12px 4px;background:transparent;border:none;border-right:1px solid var(--line);
    color:var(--mute);font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer;
  }
  .segbtn:last-child{border-right:none;}
  .segbtn.on{background:var(--amber);color:#12161B;}
  .segbtn:active{background:var(--panel-2);}
  .segbtn.on:active{background:var(--amber);}
  .seg.sub{margin-top:7px;}
  .seg.sub .segbtn{font-size:13.5px;padding:12px 1px;letter-spacing:-.02em;white-space:nowrap;}
  .seg.sub.q4 .segbtn{font-size:12.5px;padding:12px 1px;letter-spacing:-.02em;}

  /* ── 日付チップ（日ごと表示の日付選択） ── */
  .chips{
    display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:4px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;min-width:76px;padding:8px 8px 6px;border-radius:11px;
    background:var(--panel);border:1px solid var(--line);color:var(--txt);
    font-family:var(--sans);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .chip .d{font-size:12px;font-weight:600;}
  .chip .h{font-family:var(--mono);font-size:14px;color:var(--amber);font-variant-numeric:tabular-nums;}
  .chip .st{font-size:9px;color:var(--mute);line-height:1.2;}
  .chip.none{opacity:.45;}
  .chip.none .h{color:var(--mute);}
  .chip.on{border-color:var(--amber);background:rgba(255,176,32,.12);}
  .chip:active{transform:scale(.97);}

  /* ── マトリクス送信アイコン行 ── */
  .mtxsend{display:flex;gap:10px;justify-content:center;margin-top:14px;}
  .mtxicon{
    flex:0 0 auto;width:74px;padding:10px 0 8px;border-radius:12px;
    display:flex;flex-direction:column;align-items:center;gap:5px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--txt);
    font-family:var(--sans);cursor:pointer;
  }
  .mtxicon svg{width:22px;height:22px;stroke:var(--txt);}
  .mtxicon span{font-size:11px;color:var(--mute);}
  .mtxicon.amber{background:var(--amber);border-color:var(--amber);}
  .mtxicon.amber svg{stroke:#12161B;}
  .mtxicon.amber span{color:#12161B;font-weight:600;}
  .mtxicon:active{transform:scale(.96);}

  /* ── 集計ボックス（月次分析で使用）── */
  .sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .sumcell{
    flex:1 1 calc(33.333% - 4px);min-width:92px;
    background:var(--panel);border:1px solid var(--line);
    border-radius:9px;padding:8px 6px;text-align:center;
  }
  .sumcell.total{border-color:var(--amber);}
  .sumcell .k{font-size:10px;color:var(--mute);line-height:1.25;word-break:break-word;}
  .sumcell .v{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;}

  /* ── 推移グラフ ── */
  .trendwrap{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 6px 6px;}
  .trendwrap svg{display:block;}
  .legend{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:6px 6px 2px;}
  .trendwrap + .slg{margin-top:10px;}
  .lg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--mute);}
  .lg i{width:9px;height:9px;border-radius:2px;display:inline-block;}
  .lgnote{margin-left:auto;font-size:10px;color:#5A6673;}

  .selline{margin:10px 0 2px;font-size:14px;}
  .selline .ok{color:var(--ok);font-size:12px;}
  .selline .al{color:var(--amber);font-size:12px;}

  /* ── 数値＋構成比＋増減 ── */
  .hv{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .pv{display:block;font-size:12px;color:var(--mute);font-family:var(--sans);line-height:1.3;margin-top:1px;}
  .dv{display:block;font-size:13px;font-family:var(--mono);line-height:1.3;margin-top:1px;}
  .dv.up{color:#E0A64B;}
  .dv.down{color:#6E9CD2;}
  .dv.flat{color:#5A6673;}
  .mtx td .hv{font-size:20px;font-weight:600;}
  .sumcell .hv{font-size:17px;font-weight:600;}

  /* ── 価値区分の内訳バー ── */
  .vbars{margin-top:12px;}
  .vrow{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .vrow.dim{opacity:.5;}

  .vseg.keep{background:#6E9CD2;}
  .vseg.waste{background:#C97A9E;}
  .vempty{font-size:10px;color:#4C5967;padding-left:8px;line-height:20px;}
  .fb{margin-top:10px;font-size:14px;line-height:1.6;color:var(--txt);
      background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);
      border-radius:8px;padding:8px 10px;}
  .pcttoggle{display:flex;justify-content:flex-end;margin-top:12px;}
  .pcttoggle .mini{padding:7px 12px;font-size:12px;}

  /* ── PJ別バー ── */
  .pjrow{margin-bottom:8px;}
  .pjtop{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;margin-bottom:3px;gap:8px;}
  .pjn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pjv{flex:0 0 auto;color:var(--mute);font-family:var(--mono);font-size:15px;display:flex;align-items:baseline;gap:6px;}
  .pjv .dv{display:inline;}
  .pjbar{height:8px;background:var(--panel);border-radius:3px;overflow:hidden;}
  .pjbar span{display:block;height:100%;background:var(--amber);}

  /* ── マトリクス画面：固定ヘッダとページ切替 ── */

  }
  .navbtn:active{background:var(--panel-2);}
  .navbtn.off{opacity:.3;}
  .pttl{flex:1;text-align:center;line-height:1.35;min-width:0;}
  .pttl b{font-size:15px;display:block;}
  .pttl .ok{color:var(--ok);font-size:11px;}
  .pttl .al{color:var(--amber);font-size:11px;}
  .ptot{display:block;font-family:var(--mono);font-size:17px;font-weight:600;color:var(--amber);}
  .dvi{font-family:var(--mono);font-size:15px;}

  .nowbtn{
    width:100%;margin-top:6px;padding:9px;border-radius:10px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--amber);
    font-size:13px;font-family:var(--sans);cursor:pointer;
  }

  /* ── 大きめ表示（スマホ視認性） ── */
  .sum.big .sumcell{flex:1 1 calc(33.333% - 4px);min-width:96px;padding:12px 4px;}
  .sum.big .sumcell .k{font-size:12px;}
  .sum.big .sumcell .hv{font-size:32px;letter-spacing:-.01em;}
  .sum.big .sumcell .pv{font-size:12px;}
  .sum.big .sumcell .dv{font-size:14px;}
  .stk{
    display:inline-block;background:rgba(255,176,32,.14);color:var(--amber);
    border-radius:6px;padding:1px 7px;margin-right:8px;font-size:12px;font-weight:700;
  }
  .warn.slim{padding:8px 10px;font-size:12px;line-height:1.5;}
  .vdot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:baseline;}
  .vdot.add{background:#3FB68B;}.vdot.keep{background:#6E9CD2;}.vdot.waste{background:#C97A9E;}
  .pjbar.add span{background:#3FB68B;}.pjbar.keep span{background:#6E9CD2;}.pjbar.waste span{background:#C97A9E;}

  /* ── スケジュール（ガント） ── */
  .gchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px;}
  .gchip{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--mute);

  .gantt{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 8px 8px;}
  .gday + .gday{margin-top:6px;border-top:1px solid var(--line);}
  .grow{display:grid;grid-template-columns:82px 58px minmax(0,1fr);align-items:center;column-gap:6px;min-height:22px;}
  .grow.gfirst{border-top:1px dashed rgba(125,136,148,.25);}
  .ghead{min-height:34px;align-items:end;padding-bottom:4px;}
  .gdate{grid-column:1 / span 2;font-size:13px;font-weight:700;color:var(--txt);line-height:1.2;}
  .gdate small{margin-left:6px;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--amber);}
  .gaxis{position:relative;height:14px;}
  .gaxis i{position:absolute;bottom:0;transform:translateX(-50%);font-style:normal;font-family:var(--mono);font-size:10px;color:var(--mute);}
  .gaxis i.e0{transform:none;}
  .gaxis i.e1{transform:translateX(-100%);}
  .gcat{display:flex;align-items:center;min-width:0;font-size:11.5px;color:var(--txt);}
  .gcat .gtag{width:16px;height:16px;font-size:9.5px;margin-right:4px;}
  .gcn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .gpj{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--mute);}
  .gtrack{position:relative;height:22px;}
  .gbar{position:absolute;top:5px;height:12px;border-radius:2px;cursor:pointer;transition:opacity .12s;}
  .gbar.dim{opacity:.12;}
  .gbar.hi{box-shadow:0 0 0 1.5px #FFFFFF;}

  /* ── 配分ページ：100%積み上げ帯（今回と前回） ── */
  .lc{flex:0 0 auto;width:12px;height:12px;border-radius:3px;}
  .lv{flex:0 0 auto;font-size:10px;padding:1px 4px;margin-right:0;}
  .kpi3{margin-top:10px;}
  .kpi3 .sumcell .pv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;}
  .stk2{margin-top:12px;padding:22px 10px 4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;}

  .stl{flex:0 0 58px;font-size:13px;font-weight:700;line-height:1.2;color:var(--txt);}

  .stb{position:relative;flex:1;min-width:0;height:30px;display:flex;border-radius:4px;background:var(--panel-2);}

  .sl:focus-visible{outline:2px solid var(--amber);}

  .stb.none em{font-style:normal;font-size:11px;color:var(--mute);}
  .gm{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed #FFFFFF;pointer-events:none;}
  .gm b{display:none;}
  .stkrow:first-child .gm b{display:block;position:absolute;top:-15px;transform:translateX(-50%);
    font-size:9.5px;font-weight:400;color:var(--mute);white-space:nowrap;}
  .stax{display:flex;gap:8px;height:22px;}
  .stax .stl{height:0;}
  .stt{position:relative;flex:1;min-width:0;border-top:1px solid var(--line);}
  .stt i{position:absolute;top:3px;transform:translateX(-50%);font-style:normal;font-size:10px;color:var(--mute);font-family:var(--mono);}
  .stt i:first-child{transform:none;}

  .slg{margin-top:10px;display:flex;flex-direction:column;gap:4px;}

  .slh{font-size:10.5px;color:var(--mute);padding:0 10px;text-align:right;}
  .sl{padding:7px 10px;background:var(--panel);border:1px solid var(--line);border-radius:9px;cursor:pointer;}
  .sl.on{border-color:var(--amber);background:var(--panel-2);}
  .sl.gone .snm{color:var(--mute);}
  .sn{display:flex;align-items:center;gap:6px;min-width:0;}
  .snm{min-width:0;font-size:13px;line-height:1.3;word-break:break-all;}
  .sv{text-align:right;line-height:1.15;}
  .sv b{display:block;font-family:var(--mono);font-size:15px;font-weight:600;color:var(--txt);}
  .sv small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--mute);}
  .sv.pv2 b{font-size:13px;font-weight:400;color:var(--mute);}
  .sd{text-align:right;}
  .sd .dv{display:inline;font-size:12px;}

  /* ── 転送バー（固定） ── */
  .dock{
    position:fixed;left:0;right:0;bottom:0;
    background:rgba(18,22,27,.92);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .dock-inner{max-width:520px;margin:0 auto;display:flex;gap:8px;}
  .send{
    flex:1;background:var(--amber);color:#12161B;border:none;border-radius:13px;
    padding:17px;font-size:16px;font-weight:700;font-family:var(--sans);cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .send svg{width:20px;height:20px;stroke:#12161B;}
  .send:disabled{background:#2E3944;color:#5A6673;}
  .send:disabled svg{stroke:#5A6673;}
  .send:active:not(:disabled){transform:scale(.98);}
  .icon-btn{
    width:58px;background:var(--panel);border:1px solid var(--line);
    border-radius:13px;color:var(--txt);font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:active{background:var(--panel-2);}
  .dockbtn{
    flex:1;background:var(--panel);border:1px solid var(--line);color:var(--txt);
    border-radius:13px;padding:17px;font-size:16px;font-weight:600;
    font-family:var(--sans);cursor:pointer;
  }
  .dockbtn:active{background:var(--panel-2);}

  /* ── シート ── */
  .sheet{
    position:fixed;inset:0;background:rgba(8,10,13,.7);
    display:none;align-items:flex-end;z-index:50;
  }
  .sheet.on{display:flex;}
  .sheet-in{
    width:100%;max-height:92vh;overflow-y:auto;
    background:var(--bg);border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));
    max-width:520px;margin:0 auto;
  }
  .grip{width:36px;height:4px;border-radius:2px;background:#3A4653;margin:0 auto 14px;}
  .sheet h3{margin:0 0 12px;font-size:16px;}
  .confirm-card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;text-align:center;
  }
  .confirm-card .cc-pj{font-size:14px;color:var(--mute);margin-bottom:4px;}
  .confirm-card .cc-ph .phtag{margin-left:0;max-width:none;font-size:12px;padding:3px 9px;}
  .confirm-card .cc-cat{font-size:19px;font-weight:700;margin-bottom:6px;}
  .confirm-card .cc-ph{margin-bottom:8px;}
  .confirm-card .cc-time{font-family:var(--mono);font-size:15px;color:var(--txt);}
  .confirm-card .cc-time b{color:var(--amber);}
  .opt{
    display:block;width:100%;text-align:left;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:16px;
    color:var(--txt);font-size:16px;font-family:var(--sans);margin-bottom:8px;cursor:pointer;
  }
  .opt:active{background:var(--panel-2);}
  .opt .sub{font-size:11px;color:var(--mute);margin-top:2px;}
  /* 選択リストの★お気に入り（PJ・フェーズ） */
  .opt.hasstar{position:relative;padding-right:52px;}
  .opt .ostar{
    position:absolute;top:50%;right:6px;transform:translateY(-50%);
    width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    font-size:18px;color:#4C5967;border-radius:10px;
  }
  .opt .ostar.on{color:var(--amber);}
  .opt .ostar:active{background:var(--panel-2);}
  .opt.fav{border-color:rgba(245,176,65,.45);}
  /* 設定（PJ一覧）の★ボタン */
  .listrow .nm{min-width:0;}
  /* 設定の一覧も同じ形にそろえる */
  .listrow.card{position:relative;overflow:hidden;padding-left:16px;gap:9px;}
  .listrow.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:currentColor;}
  .listrow.card.k-pj{color:#AFBAC5;}
  .listrow.card .gtag.big{width:26px;height:26px;font-size:15px;border-radius:5px;border-width:2px;margin-right:0;flex:0 0 auto;}
  .listrow.card .nm.big{font-size:17px;font-weight:700;color:var(--txt);line-height:1.3;}
  .listrow>select,.listrow>.mini{flex:0 0 auto;}
  /* フェーズの登録カード（設定） */
  .reglabel{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.04em;margin:14px 0 6px;}
  .listrow .pcount{display:block;font-size:10.5px;color:var(--mute);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .opt .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mini.favbtn{flex:0 0 auto;width:42px;min-height:42px;padding:0;font-size:17px;line-height:1;color:#4C5967;
    display:flex;align-items:center;justify-content:center;}
  .mini.favbtn.on{color:var(--amber);border-color:rgba(255,176,32,.55);}
  /* フェーズの付与トグル（設定） */
  .ghead{font-size:11px;color:var(--mute);font-weight:700;margin:2px 0 6px;letter-spacing:.04em;}
  .ghead.f{color:var(--amber);}
  /* 打刻シートの手順バー（PJ ▸ 業務分類 ▸ フェーズ） */
  .flow{display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:11.5px;margin:-6px 0 12px;}
  .flow span{padding:3px 8px;border-radius:6px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;}
  .flow .cur{background:var(--amber);color:#12161B;font-weight:700;}
  .flow .done{background:var(--panel-2);border:1px solid var(--line);color:var(--txt);}
  .flow .todo{color:var(--mute);}
  .flow i{font-style:normal;color:#4C5967;}
  .closebtn{
    width:100%;background:var(--panel-2);border:1px solid #3E4A57;border-radius:12px;
    padding:15px;color:var(--txt);font-size:16px;font-weight:600;margin-top:12px;
    font-family:var(--sans);cursor:pointer;
  }
  .closebtn:active{background:#2B343E;}
  .closebtn.done{background:var(--amber);color:#12161B;border-color:var(--amber);}
  input[type=text],select,input[type=datetime-local]{
    width:100%;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:13px;color:var(--txt);font-size:16px;
    font-family:var(--sans);margin-bottom:8px;
  }
  .row2{display:flex;gap:8px;}
  .row2>*{flex:1;}
  .mini{
    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    color:var(--txt);padding:13px 14px;font-size:15px;font-family:var(--sans);cursor:pointer;
  }
  .mini.pri{background:var(--amber);color:#12161B;border-color:var(--amber);font-weight:700;}
  .mini.dan{color:var(--rec);}
  .listrow{
    display:flex;align-items:center;gap:8px;background:var(--panel);
    border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:5px;
  }
  .listrow .nm{flex:1;font-size:14px;}
  .phgrid{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px;}
  .phopt{
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:11px 13px;color:var(--mute);font-size:14px;font-family:var(--sans);cursor:pointer;
  }
  .phopt.on{background:var(--amber);border-color:var(--amber);color:#12161B;font-weight:700;}
  .phopt:active{transform:scale(.97);}
  /* 打刻2画面目：PJの見出し＋そのPJのフェーズボタン */
  .pjhead{
    display:flex;align-items:center;gap:6px;margin:16px 0 2px;
    font-size:14px;font-weight:700;color:var(--txt);
  }
  .pjhead:first-of-type{margin-top:4px;}
  .pjhead .phtag{margin-left:0;}
  /* フェーズの付与トグル（設定）：OFFは点線＋グレー、ONはアンバー */
  .phopt.pick{color:var(--mute);border-style:dashed;}
  .phopt.pick.on{background:var(--amber);border-color:var(--amber);border-style:solid;color:#12161B;font-weight:700;}
  .phopt.pick:active{transform:scale(.96);}
  .phopt.none{color:var(--mute);border-style:dashed;}
  .note{font-size:12px;color:var(--mute);line-height:1.6;margin:10px 0;}

  .toast{
    position:fixed;left:50%;bottom:104px;transform:translateX(-50%);
    background:var(--panel-2);border:1px solid var(--line);color:var(--txt);
    padding:10px 18px;border-radius:20px;font-size:13px;z-index:99;
    opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.on{opacity:1;}
  .ver{text-align:center;color:#FFFFFF;font-size:13px;font-family:var(--mono);letter-spacing:.04em;margin-top:20px;}
  .warn{
    background:rgba(229,72,77,.12);border:1px solid rgba(229,72,77,.4);
    border-radius:10px;padding:10px 12px;margin-bottom:12px;
    font-size:12px;line-height:1.6;color:#F0B4B6;
  }
  .warn b{color:#FF9A9D;}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
</style>
</head>
<body>
<div class="wrap">

  <div id="warn"></div>

  <div class="head">
    <div class="clockrow">
      <span class="clock" id="clock">--:--:--</span>
      <span class="badge" id="state">待機中</span>
    </div>
    <div class="display">
      <div class="elapsed idle" id="elapsed">0:00:00</div>

      <span class="rb-icon">⚠</span><span class="rb-txt"></span>

  <div class="quick" id="quick"></div>

  <div class="ver">ver.1.51.0</div>
</div>

<div class="dock">
  <div class="dock-inner">
    <button class="dockbtn" id="cfgBtn" title="設定">⚙　設定</button>
  </div>
</div>

<div class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ═══════ ストレージ ═══════ */
const KEY='kosu_v1';
let mem=null;
function load(){
  try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}
  return mem||null;
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){mem=JSON.parse(JSON.stringify(S));}
}

/* ═══════ 業務分類（固定・13件／v1.44.0） ═══════
   現場6・机上6・移動1。利用者は追加・削除・入れ替えができない（表記ゆれと集計崩れを防ぐため）。
   価値区分も固定。変更するときはこの一覧を直す（＝アプリの改修）。                        */
const CATS=[
  {n:'現場対応(調査)',v:'add'},
  {n:'現場対応(準備)',v:'add'},
  {n:'現場対応(実行、立ち合い)',v:'add'},

/* ── PJは「同じ名前でも別物として扱える」よう、1件ずつ id を持つオブジェクトにした（v1.38.0）
   { id, n:名前, k:種別, ph:付与フェーズ（無ければ種別の全量）, fav:★ }                         ── */
function newPjId(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function migProjects(){
  if(!Array.isArray(S.projects)){ S.projects=[]; return; }
  if(S.projects.length && typeof S.projects[0]==='object' && S.projects[0] && S.projects[0].id) return;
  S.projects=S.projects.map(x=>{
    const n=(typeof x==='string')?x:((x&&x.n)||'');
    const o={id:newPjId(), n:n};
    const k=(S.pjKind&&S.pjKind[n])||'';
    if(kindDef(k)) o.k=k;
    const ph=S.pjPhases&&S.pjPhases[n];
    if(Array.isArray(ph)) o.ph=ph.slice();
    if(Array.isArray(S.favPj)&&S.favPj.indexOf(n)>=0) o.fav=true;
    return o;
  }).filter(o=>o.n);
  delete S.pjKind; delete S.pjPhases; delete S.favPj;   // 名前をキーにした旧データは廃止
}
/* 記録（entry.pj）は名前で持つため、集計・編集は「重複を除いた名前」で扱う */
function pjNames(){ const a=[]; S.projects.forEach(p=>{ if(a.indexOf(p.n)<0) a.push(p.n); }); return a; }
function phasesOfName(n){
  const out=[];
  S.projects.filter(p=>p.n===n).forEach(p=>phasesOf(p).forEach(x=>{ if(out.indexOf(x)<0) out.push(x); }));
  return out;
}
function kindOf(p){ return (p&&p.k)||''; }
function kindDef(k){ return PJ_KINDS.find(x=>x.k===k)||null; }
function kindName(k){ const d=kindDef(k); return d?d.n:'未設定'; }
/* 種別の1文字バッジ（業務分類の 現／机／移 と同じ見せ方にそろえる） */
function kindBadge(k){ return k==='dev'?'開':k==='prod'?'生':k==='std'?'定':'－'; }
/* 種別が持つフェーズの全量。番号はこの並びで決まる（付与を外しても番号は変わらない） */
function allPhasesOf(p){ const d=kindDef(kindOf(p)); return d?d.phases:[]; }
/* そのPJに実際に付与されているフェーズ。p.ph が無ければ種別の全量 */
function phasesOf(p){
  const all=allPhasesOf(p);
  if(!p||!Array.isArray(p.ph)) return all;
  return all.filter(x=>p.ph.indexOf(x)>=0);
}
function isPhaseOn(p,ph){ return !p||!Array.isArray(p.ph)||p.ph.indexOf(ph)>=0; }
/* ── PJに登録するフェーズ（v1.40.0）─────────────────────────────
   p.ph の意味
     undefined … 未登録（打刻のときにフェーズ一覧から選ぶ＝従来どおり3タップ）
     [名前]    … 登録済み（打刻は 業務分類 → PJ の2タップ。フェーズは自動で入る）
     []        … フェーズを使わない（2タップ・フェーズ空）
   フェーズは「時期」を表すため、1つのPJに1つだけ登録する。
   時期ごとに分けたいときは、同じ名前のPJを追加して別のフェーズを登録する。 */
function regPhase(p){ return (p&&Array.isArray(p.ph)&&p.ph.length===1)?p.ph[0]:''; }
function phaseState(p){
  if(!kindOf(p)) return 'nokind';
  if(!Array.isArray(p&&p.ph)) return 'unset';
  if(p.ph.length===1) return 'reg';
  if(p.ph.length===0) return 'none';
  return 'multi';   // v1.39以前の複数付与データ
}
/* PJの副題：「開発　1. 量産化検討」のように 種別＋付与したフェーズ名で表す（v1.37.1） */
/* PJカードの小タグ。種別はバッジ（開／生／定）が表すので、フェーズの状態だけを出す */
function pjTagLabel(p){
  const st=phaseState(p);
  if(st==='nokind') return '種別 未設定';
  if(st==='reg')    return phaseNoLabel(regPhase(p));
  if(st==='none')   return 'フェーズなし';
  if(st==='unset')  return 'フェーズ未登録';
  return phasesOf(p).length+'件から選ぶ';
}
function phaseOf(e){ return e&&e.phase?e.phase:''; }
function phaseLabel(p){ return p||PHASE_NONE; }
/* クイック打刻のキー。v1.35.0 で「PJ|業務分類|フェーズ」の3要素に戻した（区切りは FSEP） */

/* ── v1.44.2：クイック打刻の★（S.favs）の掃除 ────────────────────────────
   ★のキーは「PJ名｜業務分類｜フェーズ」の文字列で持っている。PJ名を変えた・消した、
   業務分類の名前が変わった（v1.44.0）などで、いまの一覧に無いキーが残ると
   ボタンには出ないのに枠（最大9件）だけを食いつぶし、「固定は最大9件までです」で
   新しい★が登録できなくなる。起動時と★の切替時に、出せないキーと重複を捨てる。   */
function favKeyLive(k){
  const kp=String(k).split(FSEP);
  return kp.length>=2 && S.projects.some(x=>x&&x.n===kp[0]) && S.cats.some(c=>c.n===kp[1]);

function pruneFavs(){
  if(!Array.isArray(S.favs)) { S.favs=[]; return 0; }
  const before=S.favs.length, seen={};
  S.favs=S.favs.filter(k=>{
    if(!favKeyLive(k)||seen[k]) return false;
    seen[k]=1; return true;
  });
  return before-S.favs.length;
}

/* フェーズの通し番号（種別ごとの並び順）。表示だけに使い、記録には名前を入れる */
function phaseNo(phase){
  for(let i=0;i<PJ_KINDS.length;i++){
    const j=PJ_KINDS[i].phases.indexOf(phase);
    if(j>=0) return j+1;
  }
  return 0;
}
function phaseNoLabel(phase){
  const no=phaseNo(phase);
  return no? no+'. '+phase : phase;
}
/* 業務分類の色分け：現場対応＝金色 / それ以外（机・移）＝銀色 */
function isGenba(cat){ return String(cat||'').indexOf('現場対応')===0; }
function gClass(cat){ return isGenba(cat)?'g-field':'g-desk'; }
/* 打刻の選択画面では「現場対応」の接頭辞をバッジ（現）が表すので、名前からは外して大きく見せる */
function catShort(cat){
  const t=String(cat||'');
  if(!isGenba(t)) return t;
  const m=t.match(/^現場対応[（(]?([^）)]*)[）)]?$/);
  const inner=(m&&m[1])?m[1].trim():'';
  return inner||t;
}
/* バッジは1文字。現＝現場対応、移＝移動、机＝それ以外（机上ほか） */
function gLabel(cat){
  if(isGenba(cat)) return '現';
  if(String(cat||'').indexOf('移動')===0) return '移';
  return '机';
}

const pad=n=>String(n).padStart(2,'0');
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes());};
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
function dur(ms){
  const s=Math.floor(ms/1000);
  return Math.floor(s/3600)+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);
}
function hhmm(ms){
  const m=Math.round(ms/60000);

}
// 小数時間表示（0.1h＝6分刻み）。6分→0.1h、30分→0.5h
function toDecH(ms){return Math.round(ms/3600000/0.1)*0.1;}   // ms→時間(0.1刻み,数値)
function fmtH(v){return (Math.round(v*10)/10).toFixed(1);}    // 数値→"0.5"
function hDec(ms){return fmtH(ms/3600000)+'h';}               // ms→"0.5h"
function catOf(name){return S.cats.find(c=>c.n===name)||{n:name,v:'keep'};}

/* アプリを開いた/前面に戻した時の長時間チェック（主軸：確実に動く） */
function checkStaleOnResume(){
  if(!S.running) return;
  const ms=Date.now()-S.running.start;
  const overMs=(S.alertMin||60)*60000;
  if(ms>=overMs){
    staleSheet();

function staleSheet(){
  if(!S.running) return;
  const r=S.running;
  const mins=Math.floor((Date.now()-r.start)/60000);
  const h=Math.floor(mins/60), m=mins%60;
  const dispDur=(h>0?h+'時間':'')+m+'分';
  let html='<h3>⚠ 長時間の計測が続いています</h3>';
  html+='<div class="confirm-card" style="border-color:var(--rec)">'+
     '<div class="cc-cat" style="color:var(--rec)">'+dispDur+' 計測中</div>'+
     '<div class="cc-pj">'+esc(r.cat)+' ／ '+esc(r.pj)+'</div>'+
     '<div class="cc-time">開始 '+hm(r.start)+'</div>'+
     '</div>';

  html+='<button class="closebtn" onclick="stopAtTime()">別の時刻でストップ（止め忘れ）</button>';
  html+='<button class="closebtn" onclick="closeSheet()">まだ続けている</button>';

}

function stopAtTime(){
  if(!S.running){ closeSheet(); return; }
  const r=S.running;
  const iso=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());};
  let html='<h3>終了時刻を入力</h3>';
  html+='<div class="note">実際に作業を終えた時刻を入れてください。その時刻で記録します。</div>';
  html+='<div class="note">開始: '+hm(r.start)+'</div>';
  html+='<input type="datetime-local" id="stEnd" value="'+iso(Date.now())+'">';
  html+='<div class="row2"><button class="mini" onclick="staleSheet()">戻る</button>'+
        '<button class="mini pri" onclick="applyStopAt()">この時刻で記録</button></div>';
  openSheet(html);
}
function applyStopAt(){
  if(!S.running){ closeSheet(); return; }
  const r=S.running;
  const en=new Date(document.getElementById('stEnd').value).getTime();
  if(isNaN(en)||en<=r.start){ toast('開始より後の時刻を入れてください'); return; }
  const newId='e'+en+Math.random().toString(36).slice(2,6);
  S.entries.push({id:newId,pj:r.pj,cat:r.cat,start:r.start,end:en,sent:false});
  S.running=null;_alerted=false;save();render();
  confirmSheet(newId); // そのまま送信確認へ
}

    el.classList.add('idle');el.textContent='0:00:00';
    ni.textContent='項目を選んで打刻を開始';
    st.textContent='待機中';st.style.color='';
    sb.style.display='none';
  }

  // クイックボタン（★お気に入り固定 → 最近使った順 で最大9件）
  //   ★は登録した順に先頭へ固定。残りの枠は「最後に打刻した時刻」の新しい順で埋め、
  //   枠からあふれた古いものは自動的に消える（v1.42.0：以前は頻度順だった）
  const favs=(S.favs||[]).slice();
  const lastUsed={};
  S.entries.slice(-200).forEach(e=>{
    const k=favKey(e.pj,e.cat,phaseOf(e));
    const t=e.end||e.start||0;
    if(!(k in lastUsed)||t>lastUsed[k]) lastUsed[k]=t;
  });
  const byRecent=Object.keys(lastUsed).filter(k=>favs.indexOf(k)<0).sort((a,b)=>lastUsed[b]-lastUsed[a]);
  // いまの一覧に無いPJ・業務分類（前のバージョンの名前）はボタンに出さない
  const _liveCat=n=>S.cats.some(c=>c.n===n), _livePj=n=>S.projects.some(x=>x.n===n);
  let keys=favs.concat(byRecent).filter(k=>{
    const kp=String(k).split(FSEP);
    return _livePj(kp[0]) && _liveCat(kp[1]);
  }).slice(0,9);
  if(keys.length===0 && S.projects[0] && S.cats[0]){
    keys=[favKey(S.projects[0].n,S.cats[0].n,''), favKey(S.projects[0].n,(S.cats[6]||S.cats[0]).n,'')];
  }
  const q=document.getElementById('quick');
  q.innerHTML='';
  keys.forEach(k=>{
    const kp=String(k).split(FSEP), pj=kp[0], cat=kp[1], phase=kp[2]||'';
    const isFav=favs.indexOf(k)>=0;
    const b=document.createElement('button');
    b.className='qbtn '+gClass(cat);
    const sub=esc(pj)+(phase?'・'+esc(phaseNoLabel(phase)):'');
    b.innerHTML='<span class="cat"><span class="gtag">'+gLabel(cat)+'</span>'+esc(catShort(cat))+'</span><span class="pj">'+sub+'</span>'+
      '<span class="star'+(isFav?' on':'')+'" role="button" aria-label="お気に入り固定">'+(isFav?'★':'☆')+'</span>';
    b.onclick=()=>start(pj,cat,phase);
    b.querySelector('.star').onclick=(ev)=>{ev.stopPropagation();toggleFav(k);};
    q.appendChild(b);
  });
  const add=document.createElement('button');
  add.className='qbtn add';add.textContent='＋';
  add.setAttribute('aria-label','項目を選んで開始');
  add.onclick=pickCat;
  q.appendChild(add);

  // 今日の実績
  const list=todayEntries();
  renderEntries(document.getElementById('entries'), list);

  // マトリクスは別ページ（openMatrix）で表示。ボタンに当日合計を表示
  const mtxBtn=document.getElementById('mtxBtn');
  if(mtxBtn){
    const m=buildMatrix(list);
    const un=unsentDays();
    mtxBtn.textContent = (m.hasData
      ? '🔳　工数マトリクス（PC入力用）　合計 '+fmtH(m.grand)+'h'
      : '🔳　工数マトリクス（PC入力用）を開く')
      + (un.length?'\n⚠ '+un.map(dk=>dkText(dk)).join('・')+' が未送信':'');
    mtxBtn.classList.toggle('alert', un.length>0);
  }

  save();
}

// 当日の実績（新しい順）
function todayEntries(){
  const t=dkey(Date.now());
  return S.entries.filter(e=>dkey(e.start)===t).sort((a,b)=>b.start-a.start);
}
/* ── 期間モデル（日次／週次／月次） ───────────────────────────
   記録は削除されないため、期間を選び直せばいつでも再表示・再送信できる */
const MODE_LABEL={day:'日次',week:'週次',month:'月次'};
const PREV_LABEL={day:'前回記録日',week:'先週',month:'先月'};
const PREV_SHORT={day:'前回',week:'先週',month:'先月'};
const WD=['日','月','火','水','木','金','土'];
function dayStart(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function dstart(dk){const p=dk.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).getTime();}
function dkeyOffset(off){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-off);return dkey(d.getTime());}
function dkText(dk){const p=dk.split('-').map(Number);return p[1]+'/'+p[2]+'('+WD[new Date(p[0],p[1]-1,p[2]).getDay()]+')';}
const md_=t=>{const d=new Date(t);return (new Date(t).getMonth()+1)+'/'+new Date(t).getDate();};
function dayEntries(dk){ return S.entries.filter(e=>dkey(e.start)===dk).sort((a,b)=>b.start-a.start); }
function recentDayKeys(n){ const a=[]; for(let i=0;i<(n||7);i++) a.push(dkeyOffset(i)); return a; } // 新しい順
function dayTotalH(dk){ return buildMatrix(dayEntries(dk),'day').grand; }
// マトリクスをOutlookへ送った日の記録（記録単位のsentとは別管理）
function isDaySent(dk){ return !!(S.mtxSent&&S.mtxSent[dk]); }
function markDaySent(dk){ if(!S.mtxSent) S.mtxSent={}; S.mtxSent[dk]=Date.now(); save(); }
function unmarkDaySent(dk){ if(S.mtxSent) delete S.mtxSent[dk]; save(); openMatrix(); render(); }
// 直近7日のうち「記録があるのに未送信」の日（今日は除く＝まだ勤務中のため）
function unsentDays(){
  const today=dkeyOffset(0);
  return recentDayKeys(7).filter(dk=>dk!==today&&dayEntries(dk).length>0&&!isDaySent(dk));
}
// 週キー＝その週の月曜の日付キー
function weekKeyOf(t){const d=dayStart(t),dow=new Date(d).getDay();return dkey(d-((dow+6)%7)*86400000);}
function curKey(mode){const n=Date.now();return mode==='week'?weekKeyOf(n):mode==='month'?monthKey(n):dkey(n);}
function periodSpan(mode,key){
  if(mode==='week'){const f=dstart(key);return {from:f,to:f+7*86400000-1};}
  if(mode==='month'){const p=key.split('-').map(Number);return {from:new Date(p[0],p[1]-1,1).getTime(),to:new Date(p[0],p[1],1).getTime()-1};}
  const f=dstart(key); return {from:f,to:f+86399999};
}
function periodEntries(mode,key){
  const s=periodSpan(mode,key);
  return S.entries.filter(e=>e.start>=s.from&&e.start<=s.to).sort((a,b)=>b.start-a.start);
}
function periodShort(mode,key){ // グラフの軸ラベル
  if(mode==='week'){const s=periodSpan('week',key);return md_(s.from)+'〜';}
  if(mode==='month'){return Number(key.split('-')[1])+'月';}
  return dkText(key);
}
function periodTitle(mode,key){
  if(mode==='week'){const s=periodSpan('week',key);return md_(s.from)+'〜'+md_(s.to)+' の週';}
  if(mode==='month'){const p=key.split('-');return p[0]+'年'+Number(p[1])+'月';}
  return key+' '+dkText(key);
}
function periodKeys(mode,n){ // 古い→新しい
  const a=[],now=Date.now();
  for(let i=n-1;i>=0;i--){
    if(mode==='week') a.push(dkey(dstart(weekKeyOf(now))-i*7*86400000));
    else if(mode==='month'){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);a.push(monthKey(d.getTime()));}
    else a.push(dkeyOffset(i));
  }
  return a;
}
// 比較対象の期間（日次は直前の「記録がある日」＝土日や休みを飛ばす）
function prevPeriodKey(mode,key){
  if(mode==='week') return dkey(dstart(key)-7*86400000);
  if(mode==='month'){const p=key.split('-').map(Number);return monthKey(new Date(p[0],p[1]-2,1).getTime());}
  const t=dstart(key);
  for(let i=1;i<=21;i++){ const dk=dkey(t-i*86400000); if(dayEntries(dk).length) return dk; }
  return null;
}
/* 集計（ms単位）。マトリクスの丸めとは別に、構成比・比較用に使う */
function agg(list){
  const byV={add:0,keep:0,waste:0},byPj={},byCat={},byPhase={};
  let total=0, phased=0, byPhaseMs=0;
  list.forEach(e=>{ const ms=e.end-e.start,c=catOf(e.cat),ph=phaseLabel(phaseOf(e));
    total+=ms; byV[c.v]+=ms; byPj[e.pj]=(byPj[e.pj]||0)+ms; byCat[e.cat]=(byCat[e.cat]||0)+ms;
    byPhase[ph]=(byPhase[ph]||0)+ms; if(phaseOf(e)){ phased++; byPhaseMs+=ms; } });
  return {total,byV,byPj,byCat,byPhase,phased,byPhaseMs,days:new Set(list.map(e=>dkey(e.start))).size,n:list.length};
}
// フェーズが1件でも記録されているか（未使用なら出力に節を足さない）
function hasPhase(list){ return list.some(e=>!!phaseOf(e)); }
// フェーズ別の集計行（多い順）。時間は0.1h刻みに丸める
function phaseRows(list){
  const a=agg(list);
  return Object.keys(a.byPhase).sort((x,y)=>a.byPhase[y]-a.byPhase[x])
    .map(k=>({name:k, h:toDecH(a.byPhase[k]), pct:pctOf(a.byPhase[k],a.total)}));
}
function pctOf(part,total){ return total>0?Math.round(part/total*100):0; }
// 増減の表示（増＝暖色／減＝寒色。良し悪しは分類によるため中立色）
function diffTag(curH,prevH,unit){
  if(prevH==null) return '';
  const d=Math.round((curH-prevH)*10)/10;
  if(Math.abs(d)<0.05) return '<span class="dv flat">±0</span>';
  return '<span class="dv '+(d>0?'up':'down')+'">'+(d>0?'▲+':'▼')+fmtH(Math.abs(d)*(d>0?1:1))+(unit||'')+'</span>';
}
function diffPt(cur,prev){
  if(prev==null) return '';
  const d=cur-prev;
  if(d===0) return '<span class="dv flat">±0pt</span>';
  return '<span class="dv '+(d>0?'up':'down')+'">'+(d>0?'▲+':'▼')+Math.abs(d)+'pt</span>';
}

/* 現在の選択（日次／週次／月次 × 期間キー）を1か所にまとめる。
   画面表示・CSV・Markdown・Outlook送信はすべてこの情報を参照する */
function validKey(mode,k){
  if(!k) return false;
  const okDay=/^\d{4}-\d{2}-\d{2}$/.test(k), okMon=/^\d{4}-\d{2}$/.test(k);
  if(mode==='month'?!okMon:!okDay) return false;
  return periodSpan(mode,k).from<=Date.now();
}
// 期間を1つ前／後ろへ（未来へは進めない）
function shiftKey(mode,key,delta){
  if(mode==='week') return dkey(dstart(key)+delta*7*86400000);
  if(mode==='month'){const p=key.split('-').map(Number);return monthKey(new Date(p[0],p[1]-1+delta,1).getTime());}
  return dkey(dstart(key)+delta*86400000);
}
function selInfo(){
  const mode=['day','week','month'].indexOf(S.mtxMode)>=0?S.mtxMode:'day';
  const key=validKey(mode,S.mtxKey)?S.mtxKey:curKey(mode);
  const s=periodSpan(mode,key), list=periodEntries(mode,key);
  const title=periodTitle(mode,key);
  const endD=dkey(Math.min(s.to,Date.now()));
  return {mode,key,list,span:s,title,
    caption:'／'+MODE_LABEL[mode]+'：'+title,
    head:title+' の実績マトリクス',
    fileKey:mode==='day'?key:(dkey(s.from)+'_'+endD),
    outDate:mode==='day'?key:endD,
    subject:'#kosu '+MODE_LABEL[mode]+'実績サマリー '+title,
    tagHead:mode==='day'?('#kosu-matrix 日付=['+key+']'):('#kosu-matrix 期間=['+dkey(s.from)+'〜'+dkey(s.to)+']')};
}

// マトリクスHTMLを生成（横:PJ × 縦:業務分類、0.1h刻み、行/列/総合計は丸めセルの合計）
function buildMatrix(list, period='day', capSuffix, opt){
  opt=opt||{};
  const SEPM='\u0001';
  const cellMs={};
  list.forEach(e=>{ const k=e.pj+SEPM+e.cat; cellMs[k]=(cellMs[k]||0)+(e.end-e.start); });
  const pjs=[]; pjNames().forEach(n=>{ if(list.some(e=>e.pj===n)) pjs.push(n); });
  list.forEach(e=>{ if(!pjs.includes(e.pj)) pjs.push(e.pj); });
  const cats=[]; S.cats.forEach(c=>{ if(list.some(e=>e.cat===c.n)) cats.push(c.n); });
  list.forEach(e=>{ if(!cats.includes(e.cat)) cats.push(e.cat); });
  const cellVal={}, rowTot={}, colTot={}; let grand=0; pjs.forEach(p=>colTot[p]=0);
  cats.forEach(cat=>{
    let rt=0;
    pjs.forEach(pj=>{ const k=pj+SEPM+cat; if(cellMs[k]!=null){ const v=toDecH(cellMs[k]); cellVal[k]=v; rt+=v; colTot[pj]+=v; } });
    rowTot[cat]=rt; grand+=rt;
  });
  if(!list.length) return {html:'<div class="empty">まだ記録がありません</div>',grand:0,hasData:false,pjs:[],cats:[],cellVal:{},rowTot:{},colTot:{},SEPM:SEPM};
  const pctv=v=>grand>0?Math.round(v/grand*100):0;
  const maxCell=Math.max.apply(null,[0.1].concat(Object.keys(cellVal).map(k=>cellVal[k])));
  const showPct=!!opt.pct, heat=!!opt.heat;
  let thead='<tr><th class="cnr">業務分類 ＼ PJ</th>';
  pjs.forEach(pj=>{ thead+='<th>'+esc(pj)+'</th>'; });
  thead+='<th class="tot">合計</th></tr>';
  let tbody='';
  cats.forEach(cat=>{
    const vc=catOf(cat).v;
    tbody+='<tr><th>'+esc(cat)+'</th>';
    pjs.forEach(pj=>{
      const v=cellVal[pj+SEPM+cat];
      if(v==null){ tbody+='<td class="empty">–</td>'; return; }
      const bg=heat?' style="background:rgba(255,176,32,'+(0.04+0.28*(v/maxCell)).toFixed(3)+')"':'';
      tbody+='<td'+(v<0.05?' class="z"':'')+bg+'><span class="hv">'+fmtH(v)+'</span>'+
             (showPct?'<span class="pv">'+pctv(v)+'%</span>':'')+'</td>';
    });
    tbody+='<td class="tot"><span class="hv">'+fmtH(rowTot[cat])+'</span>'+
           (showPct?'<span class="pv">'+pctv(rowTot[cat])+'%</span>':'')+
           (opt.prevRow?diffTag(rowTot[cat],opt.prevRow[cat]||0):'')+'</td></tr>';
  });
  let tfoot='<tr><th>合計</th>';
  pjs.forEach(pj=>{ tfoot+='<td class="tot"><span class="hv">'+fmtH(colTot[pj])+'</span>'+
      (showPct?'<span class="pv">'+pctv(colTot[pj])+'%</span>':'')+
      (opt.prevCol?diffTag(colTot[pj],opt.prevCol[pj]||0):'')+'</td>'; });
  tfoot+='<td class="tot"><span class="hv">'+fmtH(grand)+'</span>'+(showPct?'<span class="pv">100%</span>':'')+
      (opt.prevGrand!=null?diffTag(grand,opt.prevGrand):'')+'</td></tr>';
  const caption='単位：h（0.1h＝6分刻み）'+(capSuffix||'');
  const html='<div class="mtx-wrap"><table class="mtx">'+
    '<caption>'+caption+'</caption>'+
    '<thead>'+thead+'</thead><tbody>'+tbody+'</tbody><tfoot>'+tfoot+'</tfoot></table></div>';
  return {html,grand,hasData:true,pjs,cats,cellVal,rowTot,colTot,SEPM};
}

/* ══ 3軸の階層集計：業務分類 → PJ → フェーズ（v1.43.0） ══
   ・時間は葉（業務分類×PJ×フェーズ）を0.1h刻みに丸め、上位は丸め後の合計＝見た目と合計が必ず一致する
   ・業務分類の並びは設定の並び順（固定）、その中のPJとフェーズは時間の多い順
   ・そのPJにフェーズ付きの記録が無ければ（フェーズ未設定だけなら）フェーズ行は出さない        */
function buildTri(list){
  const SEP='\u0001', ms={};
  list.forEach(e=>{ const k=e.cat+SEP+e.pj+SEP+phaseLabel(phaseOf(e)); ms[k]=(ms[k]||0)+(e.end-e.start); });
  const order=[]; S.cats.forEach(c=>{ if(list.some(e=>e.cat===c.n)) order.push(c.n); });
  list.forEach(e=>{ if(order.indexOf(e.cat)<0) order.push(e.cat); });
  const r1=v=>Math.round(v*10)/10;
  let grand=0;
  const cats=order.map(cat=>{
    const pjMap={};
    Object.keys(ms).forEach(k=>{
      const q=k.split(SEP); if(q[0]!==cat) return;
      (pjMap[q[1]]=pjMap[q[1]]||[]).push({name:q[2], h:toDecH(ms[k])});
    });
    const pjs=Object.keys(pjMap).map(pj=>{
      const phases=pjMap[pj].sort((x,y)=>y.h-x.h);
      const one=(phases.length===1)?phases[0].name:'';   // フェーズが1件だけならPJ行に併記して畳む
      return {name:pj, h:r1(phases.reduce((t,x)=>t+x.h,0)), phases:phases,
              solo:one, label:pj+(one&&one!==PHASE_NONE?'　／　'+one:''), onlyNone:(phases.length===1)};
    }).sort((x,y)=>y.h-x.h||String(x.name).localeCompare(String(y.name),'ja'));
    const h=r1(pjs.reduce((t,x)=>t+x.h,0));
    grand=r1(grand+h);
    return {name:cat, v:catOf(cat).v, h:h, pjs:pjs};
  }).filter(c=>c.pjs.length);
  cats.forEach(c=>{ c.pct=pctOf(c.h,grand);
    c.pjs.forEach(p=>{ p.pct=pctOf(p.h,grand); p.phases.forEach(x=>x.pct=pctOf(x.h,grand)); }); });
  return {cats:cats, grand:grand, hasData:!!list.length};
}
// 葉（業務分類×PJ×フェーズ）を1行ずつの配列に（CSV・タグ行用）
function triFlat(t){
  const out=[];
  t.cats.forEach(c=>c.pjs.forEach(p=>p.phases.forEach(x=>
    out.push({cat:c.name, v:c.v, pj:p.name, phase:x.name, h:x.h, pct:x.pct}))));
  return out;
}
/* 画面用（「表」タブ） */
function triHtml(t, showPct, capSuffix, prevCat){
  if(!t.hasData) return '<div class="empty">まだ記録がありません</div>';

  let h='<div class="mtx-wrap"><table class="tri">'+

    '<thead><tr><th class="cnr">業務分類 ＞ PJ ＞ フェーズ</th><th>時間</th>'+(showPct?'<th>構成比</th>':'')+'</tr></thead><tbody>';
  t.cats.forEach(c=>{
    h+='<tr class="r-cat"><th><span class="vtag '+VCLASS[c.v]+'">'+VLABEL[c.v]+'</span>'+esc(c.name)+'</th>'+
       '<td class="tot"><span class="hv">'+fmtH(c.h)+'</span>'+(prevCat?diffTag(c.h,prevCat[c.name]||0):'')+'</td>'+
       (showPct?'<td class="tot">'+c.pct+'%</td>':'')+'</tr>';
    c.pjs.forEach(p=>{

         (showPct?'<td>'+p.pct+'%</td>':'')+'</tr>';
      if(p.onlyNone) return;

      });
    });
  });
  h+='</tbody><tfoot><tr><th>合計</th><td class="tot"><span class="hv">'+fmtH(t.grand)+'</span></td>'+

  return h;
}
/* Outlook予定の本文用（罫線表・style属性のみ／幅3列で横に伸びない） */
function triBodyHtml(t, sel){

        ((pa&&pa.total)?('　（'+PREV_LABEL[sel.mode]+'比 合計 '+((a.total-pa.total)>=0?'+':'−')+fmtH(Math.abs(a.total-pa.total)/3600000)+'h／付加価値 '+((pctOf(a.byV.add,a.total)-pctOf(pa.byV.add,pa.total))>=0?'+':'−')+Math.abs(pctOf(a.byV.add,a.total)-pctOf(pa.byV.add,pa.total))+'pt）'):'')+'</p>';
  html+='<table style="border-collapse:collapse;font-size:12px;" cellpadding="6" cellspacing="0">';
  html+='<tr>'+
    '<th style="border:'+B+';background:#f2f2f2;text-align:left;">業務分類 ＞ PJ ＞ フェーズ</th>'+
    '<th style="border:'+B+';background:#f2f2f2;text-align:center;">時間</th>'+
    '<th style="border:'+B+';background:#f2f2f2;text-align:center;">構成比</th></tr>';

/* 業務分類の色（配分ページと共通）。現行13分類は並び順で固定、それ以外（旧名）は名前順で予備色 */
const CAT_EXTRA_COLORS=['#A0CBE8','#FFBE7D','#F1CE63','#B6992D','#499894','#D37295','#79706E'];
function catColor(name){
  const ci=S.cats.findIndex(c=>c.n===name);
  if(ci>=0) return PIE_COLORS[ci%PIE_COLORS.length];
  const others=[...new Set(S.entries.map(e=>e.cat))].filter(n=>!S.cats.some(c=>c.n===n)).sort();
  const k=others.indexOf(name);
  return CAT_EXTRA_COLORS[(k<0?0:k)%CAT_EXTRA_COLORS.length];
}
function catOrder(names){
  const base=S.cats.map(c=>c.n).filter(n=>names.indexOf(n)>=0);
  return base.concat(names.filter(n=>base.indexOf(n)<0).sort());
}
/* 推移グラフ（業務分類の積み上げ棒）。棒をタップするとその期間に切り替わる＝期間選択も兼ねる */
function trendChart(mode,selKey){
  const big=true;
  const n=mode==='day'?10:8;
  const keys=periodKeys(mode,n);
  const data=keys.map(k=>({k,g:agg(periodEntries(mode,k))}));
  const maxH=Math.max.apply(null,[0.5].concat(data.map(d=>d.g.total/3600000)));
  const CW=44, H=200, TOP=20, BH=142, BASE=TOP+BH, BW=26;
  const used=[]; data.forEach(d=>Object.keys(d.g.byCat).forEach(c=>{ if(d.g.byCat[c]>0&&used.indexOf(c)<0) used.push(c); }));
  const order=catOrder(used);
  let g='';
  data.forEach((d,i)=>{
    const x=i*CW+(CW-BW)/2, tot=d.g.total/3600000, on=d.k===selKey;
    if(on) g+='<rect x="'+(i*CW+2)+'" y="'+(TOP-14)+'" width="'+(CW-4)+'" height="'+(H-TOP+6)+'" rx="8" fill="rgba(255,176,32,.10)" stroke="#FFB020" stroke-width="1"/>';
    let y=BASE;
    if(tot>0){
      order.forEach(c=>{   // 下から設定の並び順に積む
        const hh=((d.g.byCat[c]||0)/3600000)/maxH*BH;
        if(hh>0.4){ y-=hh; g+='<rect class="tc" data-hi="'+order.indexOf(c)+'" x="'+x+'" y="'+y.toFixed(1)+'" width="'+BW+'" height="'+hh.toFixed(1)+'" fill="'+catColor(c)+'" opacity="'+(on?1:.62)+'"><title>'+esc(c)+' '+fmtH(d.g.byCat[c]/3600000)+'h</title></rect>'; }
      });
      g+='<text x="'+(x+BW/2)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" font-size="13" fill="'+(on?'#FFB020':'#7D8894')+'">'+fmtH(tot)+'</text>';
    }else{
      g+='<line x1="'+x+'" y1="'+BASE+'" x2="'+(x+BW)+'" y2="'+BASE+'" stroke="#3A434F" stroke-width="2"/>';
    }
    const unsent=mode==='day'&&tot>0&&d.k!==dkeyOffset(0)&&!isDaySent(d.k);
    g+='<text x="'+(i*CW+CW/2)+'" y="'+(H-12)+'" text-anchor="middle" font-size="11.5" fill="'+(on?'#E6EDF3':'#7D8894')+'">'+esc(periodShort(mode,d.k))+'</text>';
    if(mode==='day'){
      g+='<text x="'+(i*CW+CW/2)+'" y="'+(H-2)+'" text-anchor="middle" font-size="10.5" fill="'+(unsent?'#FFB020':'#3FB68B')+'">'+(tot>0?(isDaySent(d.k)?'送信済':(d.k===dkeyOffset(0)?'':'未送信')):'')+'</text>';
    }
    g+='<rect x="'+(i*CW)+'" y="0" width="'+CW+'" height="'+H+'" fill="transparent" style="cursor:pointer" onclick="setMtxKey(\''+d.k+'\')"></rect>';
  });
  return '<div class="trendwrap"><svg viewBox="0 0 '+(n*CW)+' '+H+'" width="100%" style="height:auto;max-height:320px" preserveAspectRatio="xMidYMid meet">'+
         '<line x1="0" y1="'+BASE+'" x2="'+(n*CW)+'" y2="'+BASE+'" stroke="#2E3944" stroke-width="1"/>'+g+'</svg>'+
         '<div class="legend"><span class="lgnote">棒をタップで期間切替 ／ 凡例をタップで強調</span></div></div>'+
         chartLegend(mode,selKey,order);
}
/* グラフの凡例：選択中の期間（今回）と、その前の期間を並べる */
function chartLegend(mode,selKey,order){
  if(!order.length) return '<div class="empty">まだ記録がありません</div>';
  const a=agg(periodEntries(mode,selKey)), pk=prevPeriodKey(mode,selKey);
  const P=pk?agg(periodEntries(mode,pk)):null;
  _hlNames=order.slice();
  const items=order.map(c=>({name:c,cur:a.byCat[c]||0,prev:P?(P.byCat[c]||0):0,v:catOf(c).v,color:catColor(c)}));
  return legendRows(items,a.total,P?P.total:0,PREV_SHORT[mode],true);
}

/* ページ4：スケジュール（ガント）v1.48.0
   行＝日付 ＞ 業務分類 ＞ PJ、横軸＝時刻。色は業務分類（配分・グラフと共通） */
let _schedHide={}, _schedKey='';
function schedToggle(dk){
  if(dk==='*'){ _schedHide={}; }
  else if(_schedHide[dk]) delete _schedHide[dk]; else _schedHide[dk]=1;
  document.querySelectorAll('.gday').forEach(el=>{ el.hidden=!!_schedHide[el.getAttribute('data-dk')]; });
  document.querySelectorAll('.gchip').forEach(el=>{
    const k=el.getAttribute('data-dk');
    const on=(k==='*')?Object.keys(_schedHide).length===0:!_schedHide[k];
    el.classList.toggle('on',on);
    el.setAttribute('aria-pressed',on?'true':'false');
  });
}
function hhmmOf(t){ const d=new Date(t); return d.getHours()+':'+pad(d.getMinutes()); }
function viewSchedule(sel){
  const list=sel.list.filter(e=>e.end>e.start);
  if(!list.length) return '<div class="empty">まだ記録がありません</div>';
  const selKey=sel.mode+'|'+sel.key;
  if(_schedKey!==selKey){ _schedHide={}; _schedKey=selKey; }
  // 日付ごとにまとめる（新しい日が上）
  const days={};
  list.forEach(e=>{ const dk=dkey(e.start); (days[dk]=days[dk]||[]).push(e); });
  const dks=Object.keys(days).sort().reverse();
  // 時刻の範囲（その日の0時からの時間）。全日で共通の目盛りにする
  let lo=24, hi=0;
  list.forEach(e=>{ const b=dstart(dkey(e.start));
    lo=Math.min(lo,(e.start-b)/3600000); hi=Math.max(hi,Math.min(24,(e.end-b)/3600000)); });
  lo=Math.max(0,Math.floor(lo)); hi=Math.min(24,Math.ceil(hi));
  if(hi-lo<8){ const ext=Math.ceil((8-(hi-lo))/2); lo=Math.max(0,lo-ext); hi=Math.min(24,lo+8); }
  const span=hi-lo, step=span>16?3:span>8?2:1;
  const pos=x=>((x-lo)/span*100);
  const ticks=[]; for(let t=Math.ceil(lo/step)*step; t<=hi; t+=step) ticks.push(t);
  const axis='<span class="gaxis">'+ticks.map(t=>'<i class="'+(t===lo?'e0':t===hi?'e1':'')+'" style="left:'+pos(t).toFixed(2)+'%">'+t+'</i>').join('')+'</span>';
  const grid='background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px '+(100/span).toFixed(4)+'%);';
  // 凡例と強調の対象（この期間にある業務分類）
  const cats=catOrder([...new Set(list.map(e=>e.cat))]);
  let h='';
  if(dks.length>1){
    h+='<div class="gchips" role="group" aria-label="表示する日">'+
       '<button class="gchip'+(Object.keys(_schedHide).length?'':' on')+'" data-dk="*" onclick="schedToggle(\'*\')">すべて</button>'+
       dks.map(dk=>'<button class="gchip'+(_schedHide[dk]?'':' on')+'" data-dk="'+dk+'" aria-pressed="'+(_schedHide[dk]?'false':'true')+'" onclick="schedToggle(\''+dk+'\')">'+dkText(dk)+'</button>').join('')+
       '</div>';
  }
  h+='<div class="gantt">';
  dks.forEach(dk=>{
    const es=days[dk], base=dstart(dk);
    const tot=es.reduce((a,e)=>a+(e.end-e.start),0);
    // 業務分類 → PJ の行。並びはその日の最初の打刻時刻順（同じ分類はまとめる）
    const rows={}, order=[];
    es.slice().sort((a,b)=>a.start-b.start).forEach(e=>{
      const k=e.cat+'|'+e.pj;
      if(!rows[k]){ rows[k]={cat:e.cat,pj:e.pj,es:[]}; order.push(k); }
      rows[k].es.push(e);
    });
    const seq=order.slice(), catFirst={};
    seq.forEach((k,i)=>{ const c=rows[k].cat; if(!(c in catFirst)) catFirst[c]=i; });
    order.sort((a,b)=>(catFirst[rows[a].cat]-catFirst[rows[b].cat])||(seq.indexOf(a)-seq.indexOf(b)));
    h+='<div class="gday" data-dk="'+dk+'"'+(_schedHide[dk]?' hidden':'')+'>'+
       '<div class="grow ghead"><span class="gdate">'+dkText(dk)+'<small>'+fmtH(tot/3600000)+'h</small></span>'+axis+'</div>';
    let prevCat=null;
    order.forEach(k=>{
      const r=rows[k], ci=cats.indexOf(r.cat), col=catColor(r.cat), first=r.cat!==prevCat;
      prevCat=r.cat;
      h+='<div class="grow'+(first?' gfirst':'')+'">'+
         '<span class="gcat">'+(first?'<span class="gtag '+gClass(r.cat)+'">'+gLabel(r.cat)+'</span><span class="gcn">'+esc(catShort(r.cat))+'</span>':'')+'</span>'+
         '<span class="gpj">'+esc(r.pj)+'</span>'+
         '<span class="gtrack" style="'+grid+'">'+
         r.es.map(e=>{
           const a=Math.max(lo,(e.start-base)/3600000), b=Math.min(hi,(e.end-base)/3600000);
           if(b<=a) return '';
           const tip=hhmmOf(e.start)+'-'+hhmmOf(e.end)+' '+r.cat+' / '+r.pj+(phaseOf(e)?' / '+phaseOf(e):'')+' '+fmtH((e.end-e.start)/3600000)+'h';
           return '<span class="gbar" data-hi="'+ci+'" title="'+esc(tip)+'" onclick="hlPick('+ci+')" style="left:'+pos(a).toFixed(2)+'%;width:'+Math.max(0.6,pos(b)-pos(a)).toFixed(2)+'%;background:'+col+'"></span>';
         }).join('')+
         '</span></div>';
    });
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="legend"><span class="lgnote">横軸は時刻 ／ 凡例や帯をタップで強調</span></div>';
  h+=chartLegend(sel.mode,sel.key,cats);
  return h;
}

function stkBar(label,sub,items,key,total,marks){

/* KPIカード（サマリーの3枚と同じ形） */
function kpiCard(label,val,diff,sub,good){
  return cell(label,'<span class="hv"'+(good?' style="color:#3FB68B"':'')+'>'+val+'</span>'+(diff||'')+(sub?'<span class="pv">'+sub+'</span>':''));
}
function diffCount(cur,prev){
  if(prev==null) return '';
  const d=cur-prev;
  if(d===0) return '<span class="dv flat">±0件</span>';
  return '<span class="dv '+(d>0?'up':'down')+'">'+(d>0?'▲+':'▼')+Math.abs(d)+'件</span>';
}
function shareOf(src,total,fn){ let ms=0; Object.keys(src).forEach(k=>{ if(fn(k)) ms+=src[k]; }); return pctOf(ms,total); }
function topOf(src){ let t=null; Object.keys(src).forEach(k=>{ if(t==null||src[k]>src[t]) t=k; }); return t; }
function pjKindByName(n){ const p=S.projects.find(x=>x.n===n&&x.k); return p?p.k:''; }

function breakdownKpis(kind,a,P,label){
  const has=!!P, cards=[];
  const pp=(src,fn)=>has?shareOf(src,P.total,fn):null;
  if(kind==='pj'){
    const dev=k=>pjKindByName(k)==='dev';
    const v=shareOf(a.byPj,a.total,dev);
    cards.push(kpiCard('開発PJの割合',v+'%',has?diffPt(v,pp(P.byPj,dev)):'',label));
    const t=topOf(a.byPj), tv=pctOf(a.byPj[t],a.total);
    cards.push(kpiCard('最も多いPJ',tv+'%',has?diffPt(tv,pctOf(P.byPj[t]||0,P.total)):'',esc(t)));
    const n=Object.keys(a.byPj).length;
    cards.push(kpiCard('PJ数',n+'件',has?diffCount(n,Object.keys(P.byPj).length):'','掛け持ちの数'));
  }else if(kind==='cat'){
    const g=k=>isGenba(k);
    const v=shareOf(a.byCat,a.total,g);
    cards.push(kpiCard('現場対応の割合',v+'%',has?diffPt(v,pp(P.byCat,g)):'',label));
    const m=k=>k==='会議';
    const mv=shareOf(a.byCat,a.total,m);
    cards.push(kpiCard('会議の割合',mv+'%',has?diffPt(mv,pp(P.byCat,m)):'',label));
    const t=topOf(a.byCat), tv=pctOf(a.byCat[t],a.total);
    cards.push(kpiCard('最も多い分類',tv+'%',has?diffPt(tv,pctOf(P.byCat[t]||0,P.total)):'',esc(catShort(t))));
  }else if(kind==='val'){
    const tg=S.vhTarget||50, wt=S.wasteTarget||0;
    const v=pctOf(a.byV.add,a.total), w=pctOf(a.byV.waste,a.total), k=pctOf(a.byV.keep,a.total);
    cards.push(kpiCard('投資の割合',v+'%',has?diffPt(v,pctOf(P.byV.add,P.total)):'','目標'+tg+'%'+(v>=tg?' 達成':'まで あと'+(tg-v)+'pt'),v>=tg));
    cards.push(kpiCard('ムダの割合',w+'%',has?diffPt(w,pctOf(P.byV.waste,P.total)):'','上限'+wt+'%'+(w<=wt?' 以内':' 超過'),w<=wt));
    cards.push(kpiCard('現状維持の割合',k+'%',has?diffPt(k,pctOf(P.byV.keep,P.total)):'',label));
  }else{
    const cov=Math.round(a.total?a.byPhaseMs/a.total*100:0);
    const pcov=has?Math.round(P.total?P.byPhaseMs/P.total*100:0):null;
    cards.push(kpiCard('フェーズ記入率',cov+'%',has?diffPt(cov,pcov):'','時間ベース'));
    const src={}; Object.keys(a.byPhase).forEach(x=>{ if(x!==PHASE_NONE) src[x]=a.byPhase[x]; });
    const t=topOf(src);
    if(t){ const tv=pctOf(src[t],a.total);
      cards.push(kpiCard('最も多いフェーズ',tv+'%',has?diffPt(tv,pctOf(P.byPhase[t]||0,P.total)):'',esc(t)));
    }else cards.push(kpiCard('最も多いフェーズ','－','','フェーズの記録なし'));
    const n=Object.keys(src).length, pn=has?Object.keys(P.byPhase).filter(x=>x!==PHASE_NONE).length:null;
    cards.push(kpiCard('フェーズ数',n+'件',has?diffCount(n,pn):'','同時に進めた数'));
  }
  return '<div class="sum big kpi3">'+cards.join('')+'</div>';
}

function viewBreakdown(sel,a,pa){
  const kind=['cat','pj','phase','val'].indexOf(S.mtxPie)>=0?S.mtxPie:'cat';
  let h='<div class="seg sub q4">'+[['cat','業務分類別'],['pj','PJ別'],['phase','フェーズ別'],['val','価値区分別']].map(k=>
     '<button class="segbtn'+(kind===k[0]?' on':'')+'" onclick="setMtxPie(\''+k[0]+'\')">'+k[1]+'</button>').join('')+'</div>';
  const P=(pa&&pa.total>0)?pa:null;
  if(!a.total&&!P) return h+'<div class="empty">まだ記録がありません</div>';
  const pk=prevPeriodKey(sel.mode,sel.key);
  const nowSub=esc(periodShort(sel.mode,sel.key)), prevSub=pk?esc(periodShort(sel.mode,pk)):'';
  // 名前ごとに 今回 cur・前回 prev をそろえる
  let items;
  if(kind==='val'){
    items=['add','keep','waste'].map(v=>({name:VAL_NAME[v],cur:a.byV[v]||0,prev:P?(P.byV[v]||0):0,v:v,color:VAL_COLOR[v]}));
  }else{
    const src=kind==='pj'?a.byPj:kind==='phase'?a.byPhase:a.byCat;
    const psrc=P?(kind==='pj'?P.byPj:kind==='phase'?P.byPhase:P.byCat):{};
    let names;
    if(kind==='cat'){
      // 業務分類は設定の並び（13件固定）で並べ、色も分類ごとに固定する
      names=catOrder(Object.keys(src).concat(Object.keys(psrc)).filter((n,ix,ar)=>ar.indexOf(n)===ix&&((src[n]||0)>0||(psrc[n]||0)>0)));
    }else{
      names=Object.keys(src).sort((x,y)=>src[y]-src[x]||(x<y?-1:1));
      Object.keys(psrc).filter(k=>!(k in src)&&psrc[k]>0).sort((x,y)=>psrc[y]-psrc[x]).forEach(k=>names.push(k));
      // フェーズ未設定は常に末尾・グレー
      if(kind==='phase'&&names.indexOf(PHASE_NONE)>=0){ names.splice(names.indexOf(PHASE_NONE),1); names.push(PHASE_NONE); }
    }
    items=names.map((k,i)=>{
      let color=PIE_COLORS[i%PIE_COLORS.length];
      if(kind==='cat') color=catColor(k);
      if(kind==='phase'&&k===PHASE_NONE) color='#5A6673';
      return {name:k,cur:src[k]||0,prev:psrc[k]||0,v:kind==='cat'?catOf(k).v:null,color:color};
    });
  }
  // KPIカード
  h+=breakdownKpis(kind,a,P,PREV_SHORT[sel.mode]+'比');
  // 帯（今回・前回）
  let marks=null;
  if(kind==='val') marks=[{at:(S.vhTarget||50),label:'投資目標'},{at:100-(S.wasteTarget||0),label:'ムダ上限'}].filter(m=>m.at>0&&m.at<100);
  h+='<div class="stk2">'+
     stkBar('今回',nowSub,items,'cur',a.total,marks)+
     stkBar(PREV_SHORT[sel.mode],prevSub||'－',items,'prev',P?P.total:0,marks)+
     '<div class="stax"><span class="stl"></span><span class="stt">'+[0,20,40,60,80,100].map(v=>'<i style="left:'+v+'%">'+v+'%</i>').join('')+'</span></div>'+
     '</div>';
  // 凡例（今回・前回・差）
  _hlNames=items.map(it=>it.name);
  h+=legendRows(items,a.total,P?P.total:0,PREV_SHORT[sel.mode],kind!=='val');
  return h;
}

function openMatrix(){
  const sel=selInfo(), mode=sel.mode, key=sel.key;
  const view=['pj','chart','table','sched'].indexOf(S.mtxView)>=0?S.mtxView:'pj';
  const a=agg(sel.list);
  const pk=prevPeriodKey(mode,key);
  const pa=pk?agg(periodEntries(mode,pk)):null;
  const prevRow={},prevCol={};
  if(pa){ Object.keys(pa.byCat).forEach(c=>prevRow[c]=pa.byCat[c]/3600000);
          Object.keys(pa.byPj).forEach(k=>prevCol[k]=pa.byPj[k]/3600000); }
  const showPct=S.mtxPct!==false;
  const t=buildTri(sel.list);   // v1.43.0：業務分類 → PJ → フェーズ の3軸

  // ── 未送信の案内（全ページ共通・期間タブの上） ──
  let h='';
  const un=unsentDays();
  if(un.length){
    h+='<div class="warn slim">⚠ 未送信 '+un.length+'日：'+un.map(dk=>dkText(dk)).join('・')+'（‹ › で移動）</div>';
  }
  // ── 固定ヘッダ（期間タブ＋期間ナビ＋ページ切替） ──
  h+='<div class="mtxhead">';
  h+='<div class="seg">'+['day','week','month'].map(md=>
      '<button class="segbtn'+(md===mode?' on':'')+'" onclick="setMtxMode(\''+md+'\')">'+MODE_LABEL[md]+'</button>').join('')+'</div>';
  const isNow=key===curKey(mode), canNext=validKey(mode,shiftKey(mode,key,1));
  h+='<div class="pnav">'+
     '<button class="navbtn" onclick="stepPeriod(-1)" aria-label="前へ">‹</button>'+
     '<div class="pttl"><b>'+esc(sel.title)+'</b>'+
       (mode==='day'&&!isNow?'<span class="'+(isDaySent(key)?'ok':'al')+'">'+(isDaySent(key)?'✓ 送信済':'⚠ 未送信')+'</span>':'')+
       '<span class="ptot">'+fmtH(a.total/3600000)+'h'+(pa?' '+diffTag(a.total/3600000,pa.total/3600000,'h').replace('class="dv','class="dvi'):'')+'</span></div>'+
     '<button class="navbtn'+(canNext?'':' off')+'" onclick="stepPeriod(1)" aria-label="次へ">›</button>'+
     '</div>';
  if(!isNow) h+='<button class="nowbtn" onclick="jumpNow()">'+(mode==='day'?'今日':mode==='week'?'今週':'今月')+'へ戻る</button>';
  h+='<div class="seg sub">'+[['pj','配分'],['chart','グラフ'],['table','表'],['sched','スケジュール']].map(v=>
      '<button class="segbtn'+(v[0]===view?' on':'')+'" onclick="setMtxView(\''+v[0]+'\')">'+v[1]+'</button>').join('')+'</div>';
  h+='</div>';


  h+='<div class="mtxbody">';
  if(view==='sched') h+=viewSchedule(sel);
  else if(view==='chart') h+=viewChart(sel);
  else if(view==='table') h+=viewTable(sel,t,showPct,sel.caption,pa?prevRow:null);
  else h+=viewBreakdown(sel,a,pa);
  h+='</div>';
  // ── 出力（全ページ共通） ──
  h+=sendRow(sel,t.hasData);

  h+='<button class="closebtn done" onclick="closeSheet()">閉じる</button>';
  openSheet(h);
  applyHl();
}

/* ── 今日のマトリクスを Outlook（終日予定）／CSV／MDへ ── */
function matrixRows(m){
  // [業務分類, {pj: value...}, 行合計] の配列（cats順）
  return m.cats.map(cat=>{
    const row={};
    m.pjs.forEach(pj=>{ const v=m.cellVal[pj+m.SEPM+cat]; if(v!=null) row[pj]=v; });
    return {cat,row,tot:m.rowTot[cat]};
  });
}
function matrixExportCsv(){
  const sel=selInfo(), t=buildTri(sel.list);
  if(!t.hasData){ toast('この期間の記録がありません'); return; }
  // 明細形式（1行＝業務分類×PJ×フェーズ）。Excelのピボットでそのまま集計できる

  csv+=csvCell('合計')+','+fmtH(t.grand)+',100%\r\n';

function matrixExportMd(){

function matrixTagLines(t, sel){

// 終日の予定として登録（予定表の一番上に表示され、後から見つけやすい）
function matrixOutlookUrl(t, sel){

    path:'/calendar/action/compose',

    body:triBodyHtml(t,sel)+tagsHtml
  });

function matrixSendOutlook(){

}

/* ═══════ 打刻 ═══════ */
function toggleFav(k){
  if(!S.favs) S.favs=[];
  const i=S.favs.indexOf(k);
  if(i>=0){ S.favs.splice(i,1); toast('固定を解除しました'); }
  else{
    pruneFavs();   // 出せないキーが枠を食っていることがあるので、数える前に掃除する
    if(S.favs.length>=9){ toast('固定は最大9件までです（いま'+S.favs.length+'件）。ほかの★を外してください'); return; }
    S.favs.push(k); toast('★ 固定しました（'+S.favs.length+'/9件）');
  }
  save();render();
}
/* ── ★お気に入り（PJ・フェーズ）：選択リストの並び順だけに効く ── */
function isFavPj(p){ return !!(p&&p.fav); }
function _tog(arr,k){ const i=arr.indexOf(k); if(i>=0){arr.splice(i,1);return false;} arr.push(k); return true; }
function _keepScroll(fn){
  const el=document.getElementById('sheetIn');
  const y=el?el.scrollTop:0;
  fn();
  const el2=document.getElementById('sheetIn');
  if(el2) el2.scrollTop=y;
}
function togFavPj(ev,pi,ci){
  ev.stopPropagation();
  const p=S.projects[pi]; if(!p) return;
  p.fav=!p.fav;
  toast(p.fav?'★ '+p.n+' を上に固定しました':'固定を解除しました');
  save(); _keepScroll(()=>pickPj(ci));
}
/* 設定（⚙）の PJ一覧 からの★切替 */
function togFavPjCfg(pi,fromPhase){
  const p=S.projects[pi]; if(!p) return;
  p.fav=!p.fav;
  toast(p.fav?'★ '+p.n+' を上に固定しました':'固定を解除しました');

  if(fromPhase) phaseView(pi); else cfgOpen();
}
/* ★付きを先頭へ。番号や元の並び順は変えずに並べ替えるだけ */
function favSort(items,isFav){
  const f=items.filter(isFav), r=items.filter(x=>!isFav(x));
  return {fav:f,rest:r};
}
/* ── 打刻の選択：業務分類 → PJ → フェーズ ── */
function pickCat(){
  let h='<h3>業務分類を選ぶ</h3>';
  // v1.44.1：「前に使っていた設定が残っています」の案内は廃止した。
  // 実名PJを登録するのが本来の運用で、標準の5件と違うのは正常な状態だから。
  S.cats.forEach((c,i)=>{
    h+='<button class="opt catopt '+gClass(c.n)+'" onclick="pickPj('+i+')">'+
       '<span class="gtag big">'+gLabel(c.n)+'</span>'+
       '<span class="cnm">'+esc(catShort(c.n))+'</span>'+
       '<span class="vtag '+VCLASS[c.v]+'">'+VLABEL[c.v]+'</span>'+
       '</button>';
  });
  h+='<button class="closebtn" onclick="closeSheet()">キャンセル</button>';
  openSheet(h);
}
function pickPj(ci){
  const cat=S.cats[ci]?S.cats[ci].n:'';
  let h='<h3>PJを選ぶ</h3>';
  h+='<div class="note" style="margin-top:0"><span class="gtag '+gClass(cat)+'">'+gLabel(cat)+'</span>'+esc(catShort(cat))+'</div>';
  const pjs=S.projects.map((p,i)=>({p:p,i:i}));
  const g=favSort(pjs,x=>isFavPj(x.p));
  const row=x=>{
    const p=x.p, i=x.i, f=isFavPj(p), k=kindOf(p), st=phaseState(p), tag=pjTagLabel(p);
    return '<button class="opt catopt k-pj'+(f?' fav':'')+'" onclick="afterPj('+i+','+ci+')">'+
       '<span class="gtag big">'+kindBadge(k)+'</span>'+
       '<span class="cnm">'+esc(p.n)+'</span>'+
       '<span class="ctag'+(st==='reg'?' on':'')+'">'+esc(tag)+'</span>'+
       '<span class="ostar'+(f?' on':'')+'" role="button" aria-label="よく使うPJに固定" onclick="togFavPj(event,'+i+','+ci+')">'+(f?'★':'☆')+'</span>'+
       '</button>';
  };
  if(g.fav.length && g.rest.length){
    h+='<div class="ghead f">★ よく使うPJ</div>';
    g.fav.forEach(x=>h+=row(x));
    h+='<div class="ghead">そのほか</div>';
    g.rest.forEach(x=>h+=row(x));
  }else{
    g.fav.concat(g.rest).forEach(x=>h+=row(x));
  }
  h+='<button class="closebtn" onclick="pickCat()">戻る</button>';
  openSheet(h);
}
// フェーズが決まっているPJだけ3段階目を出す（未設定なら2タップで開始）
function afterPj(pi,ci){
  const ph=phasesOf(S.projects[pi]);
  // フェーズが1つに決まっていれば（登録済み／種別なし／フェーズなし）その場で開始＝2タップ
  if(ph.length<=1){ startFrom(pi,ci,ph.length===1?0:-1); return; }
  pickPhase(pi,ci);   // 未登録のPJだけ、従来どおり一覧から選ぶ
}
function pickPhase(pi,ci){
  const p=S.projects[pi], pj=p?p.n:'', ph=phasesOf(p);
  let h='<h3>フェーズを選ぶ</h3>';
  h+='<div class="note" style="margin-top:0"><span class="gtag '+gClass(S.cats[ci].n)+'">'+gLabel(S.cats[ci].n)+'</span>'+esc(catShort(S.cats[ci].n))+' ／ '+esc(pj)+'</div>';
  ph.forEach((x,j)=>h+='<button class="opt catopt k-ph" onclick="startFrom('+pi+','+ci+','+j+')">'+
     '<span class="gtag big num">'+phaseNo(x)+'</span>'+
     '<span class="cnm">'+esc(x)+'</span></button>');
  h+='<button class="opt catopt k-none" onclick="startFrom('+pi+','+ci+',-1)">'+
     '<span class="gtag big">－</span><span class="cnm">フェーズなし</span></button>';
  h+='<button class="closebtn" onclick="pickPj('+ci+')">戻る</button>';
  openSheet(h);
}
function startFrom(pi,ci,phi){
  closeSheet();
  const p=S.projects[pi]; if(!p) return;
  const ph=(phi==null||phi<0)?'':(phasesOf(p)[phi]||'');
  start(p.n,S.cats[ci].n,ph);
}
function start(pj,cat,phase){
  if(S.running){ if(!confirm('計測中の「'+S.running.cat+'」を終了して切り替えますか？')) return; stop(true); }
  S.running={pj,cat,phase:phase||'',start:Date.now()};
  _alerted=false;
  save();render();
  if(navigator.vibrate) navigator.vibrate(12);
  toast('▶ '+cat+' 開始');
}
function stop(silent){
  if(!S.running) return;
  const r=S.running,end=Date.now();
  let newId=null;
  if(end-r.start>=10000){
    newId='e'+end+Math.random().toString(36).slice(2,6);
    S.entries.push({id:newId,pj:r.pj,cat:r.cat,phase:phaseOf(r),start:r.start,end,sent:false});
  }else if(!silent){
    toast('10秒未満のため記録しません');
  }
  S.running=null;save();render();
  _alerted=false;
  if(navigator.vibrate) navigator.vibrate([12,60,12]);
  // 切替(silent)でなく、記録できたときは確認シートを出す
  if(!silent && newId){ confirmSheet(newId); }
}
document.getElementById('stopBtn').onclick=()=>stop(false);

  h+='<button class="closebtn done" style="margin-top:14px" onclick="sendFromConfirm(\''+id+'\')">Outlookへ送信 →</button>';
